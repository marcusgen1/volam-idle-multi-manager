<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px 14px; width: 230px; font: 13px/1.4 system-ui, sans-serif; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .sw { position: relative; width: 40px; height: 22px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sl { position: absolute; inset: 0; background: #999; border-radius: 22px; transition: .15s; }
  .sl::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  input:checked + .sl { background: #2e9e4f; }
  input:checked + .sl::before { transform: translateX(18px); }
  small { display: block; margin-top: 8px; color: #666; }
</style>
</head>
<body>
  <label>
    <span><b>Tự vào lại Leo Tháp</b><br><span id="st"></span></span>
    <span class="sw"><input type="checkbox" id="on"><span class="sl"></span></span>
  </label>
  <small>Tự chọn Leo Tháp một lần trong game, extension sẽ giữ chế độ này khi bạn gục ngã.</small>
  <script src="popup.js"></script>
</body>
</html>
