<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý nhân vật</title>
<style>
  :root { --bg:#0e1412; --panel:#151d1a; --line:#2a3a34; --text:#e6e0d0; --dim:#8a9a92; --accent:#d8b04a; --ok:#6fcf8c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  /* Menu dọc bên trái: các nút chung của app. Màn hình hẹp (<= 900px) thì xếp ngang phía trên như trước. */
  #shell { flex: 1; min-height: 0; display: flex; }
  #side { width: 172px; flex: none; display: flex; flex-direction: column; gap: 3px; padding: 6px; overflow-y: auto; border-right: 1px solid var(--line); background: #101815; }
  #side h1 { font-size: 13px; margin: 0 0 4px; color: var(--accent); font-weight: 600; }
  #side button { width: 100%; padding: 2px 8px; font-size: 12px; line-height: 1.5; text-align: left; }
  #side label { font-size: 12px; }
  #side input[type=text], #side input[type=number] { width: 100%; padding: 2px 6px; font-size: 12px; background: #0e1412; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
  #side select { width: 100%; padding: 2px 4px; font-size: 12px; background: #1d2a25; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
  .grp { display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
  .grp > span { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .sep { height: 1px; background: var(--line); margin: 4px 0; flex: none; }
  .grow { flex: 1; }
  #content { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  button { background:#1d2a25; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:disabled:hover { border-color: var(--line); }
  button.on { background:#2b3d34; border-color:var(--accent); color:var(--accent); }
  button.sm { padding: 1px 7px; }

  /* Số cột / hàng được đặt bằng JS theo số khung */
  main { flex:1; min-height:0; display:grid; gap:5px; padding:5px; }
  main.max .slot:not(.maxed) { display: none; }

  .slot { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:6px; padding:3px 6px; border-bottom:1px solid var(--line); }
  .num { flex:none; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#1a1a10; font-weight:700; text-align:center; line-height:20px; font-size:12px; }
  .bar .label { flex:1; min-width:0; color:var(--text); font-weight:600; padding:2px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pxDlg { background:var(--panel); color:var(--text); border:1px solid var(--accent); border-radius:8px; padding:10px; width:min(520px,94vw); }
  #pxDlg::backdrop { background:rgba(0,0,0,.6); }
  #pxDlg .hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  #pxDlg .cur { font-size:12px; color:var(--dim); margin-bottom:6px; word-break:break-all; }
  #pxDlg .rows { display:flex; flex-direction:column; gap:3px; max-height:52vh; overflow-y:auto; }
  #pxDlg .pxrow { display:flex; align-items:center; gap:8px; text-align:left; padding:4px 8px; }
  #pxDlg .pxrow.on { background:#2b3d34; border-color:var(--accent); }
  #pxDlg .pxrow.dead { opacity:.5; }
  #pxDlg .pxrow .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  #pxDlg .pxrow .ms { flex:none; font-size:12px; color:var(--dim); }
  #pxDlg .pxrow .ms.ok { color:#5fd38d; } #pxDlg .pxrow .ms.warn { color:#e0b341; } #pxDlg .pxrow .ms.bad { color:#ef6b6b; }
  #scDlg { background:var(--panel); color:var(--text); border:1px solid var(--accent); border-radius:8px; padding:10px; width:min(440px,94vw); }
  #scDlg::backdrop { background:rgba(0,0,0,.6); }
  #scDlg .hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  #scDlg h4 { margin:10px 0 4px; font-size:12px; color:var(--dim); font-weight:600; }
  #scDlg .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  #scDlg label { display:flex; align-items:center; gap:4px; font-size:13px; cursor:pointer; }
  #scDlg .tabs button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  #scDlg input[type=text] { background:var(--bg,#111); color:var(--text); border:1px solid var(--dim); border-radius:4px; padding:3px 6px; font-size:13px; }
  #scDlg .times { display:flex; flex-direction:column; gap:4px; }
  #scDlg .time { display:flex; gap:6px; align-items:center; }
  #scDlg .info { margin-top:10px; font-size:12px; color:var(--dim); line-height:1.5; white-space:pre-line; }
  #scDlg .ft { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  #crDlg { background:var(--panel); color:var(--text); border:1px solid var(--accent); border-radius:8px; padding:10px; width:min(380px,94vw); }
  #crDlg::backdrop { background:rgba(0,0,0,.6); }
  #crDlg .hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  #crDlg .fld { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--dim); margin-bottom:6px; }
  #crDlg input[type=text], #crDlg input[type=password], #crDlg #crU { width:100%; box-sizing:border-box; }
  #crDlg .auto { display:flex; align-items:center; gap:4px; font-size:12px; margin:4px 0; cursor:pointer; }
  #crDlg .note { font-size:12px; margin:6px 0; }
  #crDlg .ft { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  #pxDlg .ft { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  #pxDlg .auto { flex-basis:100%; font-size:12px; color:var(--dim); cursor:pointer; display:flex; align-items:center; gap:4px; }
  .pxst { flex:none; font-size:11px; color:var(--dim); cursor:pointer; white-space:nowrap; max-width:48%; overflow:hidden; text-overflow:ellipsis; }
  .slot { container-type:inline-size; }
  @container (max-width: 460px) { .pxst .ip { display:none; } } /* khung hẹp (5 cột): chỉ giữ chấm trạng thái + độ trễ, IP xem ở tooltip để còn chỗ cho tên */
  .pxst.ok { color:#5fd38d; } .pxst.bad { color:#ef6b6b; } .pxst.warn { color:#e0b341; }
  .bar .label small { color:var(--dim); font-weight:400; }
  .modes { display:flex; align-items:center; gap:3px; padding:2px 5px; border-bottom:1px solid var(--line); flex-wrap: wrap; }
  .modes button.sm { padding:1px 5px; line-height:1.5; }
  .modes .st { flex:1 1 90px; min-width:0; margin-left:4px; color:var(--dim); font-size:12px; text-align:right;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .modes .st b { color:var(--ok); font-weight:600; }
  .frame { position:relative; flex:1; min-height:0; background:#000; }
  iframe, webview { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .off { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); background:#0a0f0d; }
  #upd { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:3px 10px; background:#2b2a14; border-bottom:1px solid var(--accent); color:var(--accent); font-size:12px; }
  #upd[hidden] { display:none; }
  #upd .why { color:var(--dim); flex:1 1 200px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #logPanel { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow:auto; }
  #logPanel[hidden] { display:none; }
  #logBox { width:min(900px,100%); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px 14px; }
  #logBox h2 { margin:0 0 8px; font-size:15px; color:var(--accent); display:flex; align-items:center; gap:8px; }
  #logBox h2 .grow { flex:1; }
  #logBox h3 { margin:12px 0 4px; font-size:13px; color:var(--accent); font-weight:600; }
  #logBox table { width:100%; border-collapse:collapse; font-size:12px; }
  #logBox th, #logBox td { text-align:right; padding:2px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  #logBox th:first-child, #logBox td:first-child { text-align:left; }
  #logBox th { color:var(--dim); font-weight:400; }
  #logBox tr.tot td { font-weight:600; border-top:1px solid var(--accent); }
  #logBox .pos { color:var(--ok); } #logBox .neg { color:#e27a6a; } #logBox .dim { color:var(--dim); }
  #logBox ul { list-style:none; margin:0; padding:0; max-height:42vh; overflow:auto; font-size:12px; }
  #logBox li { padding:2px 0; border-bottom:1px solid var(--line); } #logBox li time { color:var(--dim); margin-right:6px; }
  #logBox .tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
  #logToast { position:fixed; right:12px; bottom:12px; z-index:60; display:flex; flex-direction:column; gap:6px; max-width:min(420px,90vw); }
  #logToast div { background:#2b2a14; border:1px solid var(--accent); color:var(--text); border-radius:6px; padding:6px 10px; font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.5); }
  #logToast b { color:var(--accent); }
  footer { padding:3px 10px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); }
  @media (max-width: 900px) {
    #shell { flex-direction: column; }
    #side { width: auto; max-height: 45vh; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
    #side button { width: auto; }
    .grp { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .sep { width: 1px; height: auto; align-self: stretch; margin: 0 2px; }
    main { grid-template-columns:1fr !important; grid-template-rows:none !important; overflow-y:auto; }
    main .slot { grid-column:auto !important; }
    .slot { height:80vh; }
  }
</style>
</head>
<body>
<div id="shell">
<aside id="side">
  <h1 id="title">Quản lý nhân vật</h1>
  <div class="grp">
    <button id="lGrid" title="Chia lưới, các khung đều nằm ngang (4 khung = 2×2; 5 khung = 3 trên + 2 dưới)">Lưới</button>
    <button id="lRow" title="Tất cả khung cạnh nhau trong một hàng">1 hàng</button>
    <button id="addSlot" title="Thêm một khung game mới">＋ Thêm khung</button>
  </div>
  <span class="sep"></span>
  <div class="grp" id="allModes"><span>Tất cả:</span></div>
  <span class="grow"></span>
  <button id="updNow" title="Kiểm tra bản mới trên GitHub ngay (không cần chờ thông báo) và cập nhật nếu có">⬆ Cập nhật</button>
  <button id="logBtn" title="Nhật ký hoạt động của từng nhân vật: cấp tăng, ngân lượng kiếm được trong ngày, đồ đáng chú ý">📒 Nhật ký <small id="logBadge"></small></button>
  <button id="schedBtn" title="Hẹn giờ tự động chạy các lịch (Phó Bản, Phúc Duyên, …)">⏰ Hẹn giờ: TẮT</button>
  <button id="blackBtn" title="Bật / tắt màn hình đen cho tất cả khung: game ngừng vẽ nhưng vẫn chạy, nhẹ máy nhất khi treo. Bấm vào khung đen để bật lại khung đó.">🌑 Màn hình đen: TẮT</button>
  <button id="reloadAll" title="Tải lại tất cả khung game">⟳ Tải lại</button>
</aside>
<div id="content">
<div id="upd" hidden>
  <span id="updMsg"></span>
  <span class="why" id="updWhy"></span>
  <button id="updGo" class="sm" title="Tải bản mới từ GitHub (git pull) rồi tải lại trang">Cập nhật</button>
  <button id="updLater" class="sm" title="Ẩn thông báo cho đến khi có bản mới hơn">Để sau</button>
</div>
<div id="logPanel" hidden><div id="logBox"></div></div>
<div id="logToast"></div>
<main id="main"></main>
<footer id="foot"></footer>
</div>
</div>

<script>
(async () => {
  // Cấu hình từ máy chủ: cổng gốc và số cổng đã mở (mỗi khung cần một cổng riêng). Máy chủ cũ không có thì mặc định 4.
  let cfg = { base: 8800, max: 4, app: false, game: "https://volamidle.pages.dev/" };
  try {
    const r = await fetch("/__config", { cache: "no-store" });
    if (r.ok) cfg = Object.assign(cfg, await r.json());
  } catch (e) {}
  // Proxy riêng của từng khung (khóa = số cổng p), máy chủ giữ ở proxy.json; chỉ lấy bản đã che mật khẩu
  let pxList = {};
  try {
    const r = await fetch("/__proxy", { cache: "no-store" });
    if (r.ok) pxList = (await r.json()).slots || {};
  } catch (e) {}
  const BASE_PORT = cfg.base | 0 || 8800;
  const MAX_SLOTS = Math.max(1, cfg.max | 0 || 4);

  const KEY = "quanly4acc.app.v2";
  const MODES = [
    ["farm", "⚔", "Luyện Công"],
    ["quest", "📜", "Nhiệm Vụ"],
    ["dg", "🏯", "Phó Bản"],
    ["tower", "🗼", "Leo Tháp"],
  ];
  const STEP_NAME = { sell: "Bán đồ", ldt: "Mua lệnh bài", dong: "Đóng bình PD", dung: "Dùng bình PD", mo: "Mở hết PD", hb: "Mở hồng bao" }; // các bước hẹn giờ không phải chế độ
  const modeName = (m) => (MODES.find((x) => x[0] === m) || [0, 0, STEP_NAME[m] || m || "—"])[2];

  // Mỗi khung có một số cổng p cố định (cổng = BASE_PORT + p) nên phiên đăng nhập không bị lẫn khi thêm / xóa khung.
  // Trong ứng dụng desktop (desktop/main.js): mỗi khung là một <webview> có phiên riêng (partition persist:acc<số cổng>, như một hồ sơ trình duyệt riêng)
  // mở thẳng trang game chính thức. Trong trình duyệt thường: iframe tới các cổng 8801… của máy chủ cục bộ (game bản mới không còn chạy kiểu này).
  const APP = !!window.vlApp && !!cfg.app;
  const frameOrigin = (i) => location.protocol + "//" + location.hostname + ":" + (BASE_PORT + state.slots[i].p);
  const frameUrl = (i) => frameOrigin(i) + "/";

  let state = {
    layout: "grid",
    slots: Array.from({ length: Math.min(4, MAX_SLOTS) }, (_, i) => ({ label: "Tài khoản " + (i + 1), on: true, desired: null, p: i + 1 })),
  };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && Array.isArray(s.slots) && s.slots.length >= 1) state = s;
  } catch (e) {}
  // Dữ liệu cũ chưa có số cổng: khung thứ i dùng cổng i+1 như trước. Bỏ khung dư nếu máy chủ mở ít cổng hơn.
  {
    const used = new Set();
    state.slots.forEach((s, i) => {
      if (!(s.p >= 1) || used.has(s.p)) s.p = i + 1;
      used.add(s.p);
    });
    state.slots = state.slots.filter((s) => s.p <= MAX_SLOTS);
    if (!state.slots.length) state.slots = [{ label: "Tài khoản 1", on: true, desired: null, p: 1 }];
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const main = document.getElementById("main");
  let maxed = -1;
  const els = []; // song song với state.slots
  const live = []; // trạng thái nhận từ từng khung, song song với state.slots

  function post(i, msg) {
    const f = els[i] && els[i].iframe;
    if (!f) return;
    if (APP) {
      // webview chỉ nhận lệnh sau khi trang đã nạp xong (dom-ready): xếp hàng chờ rồi gửi dồn
      const m = Object.assign({ vl: 1 }, msg);
      if (!f.__ready) f.__q.push(m);
      else { try { f.send("vl", m); } catch (e) {} }
      return;
    }
    if (!f.contentWindow) return;
    try { f.contentWindow.postMessage(Object.assign({ vl: 1 }, msg), frameOrigin(i)); } catch (e) {}
  }
  const send = (i, mode, restore) => post(i, { type: "setMode", mode, restore: !!restore, after: state.comboAfter === "tower" ? "tower" : "farm" });

  const sendPd = (i, kind) => post(i, { type: "pd", kind });

  const sendSell = (i) => post(i, { type: "sell", kept: !!state.sellKept });
  const sendSellHk = (i) => post(i, { type: "sell", what: "hk" });
  const sendAutoSell = (i) => post(i, { type: "autoSell", on: !!state.autoSell, kept: !!state.sellKept });
  const sendBoss = (i) => post(i, { type: "boss" });
  const sendPet = (i, on) => post(i, { type: "pet", on: !!on });
  // Bắt thú bật / tắt theo từng khung (nhớ lại sau khi tải lại khung, giống Tự bán)
  function setPet(i, on) {
    state.slots[i].pet = !!on;
    save();
    refresh(i);
    if (state.slots[i].on) sendPet(i, on);
    if (typeof renderPetBtn === "function") renderPetBtn();
  }

  // Nhiệm Vụ / Phó Bản (kể cả Chạy tất cả) cần khung đủ rộng để game vẽ khung "Theo Dấu": bố cục 1 hàng làm khung
  // quá hẹp nên tự chuyển về lưới. Chỉ đổi từ 1 hàng sang lưới, không đụng tới khung đang phóng to.
  const needsGrid = (mode) => mode === "quest" || mode === "dg" || mode === "combo";
  function ensureGrid(mode) {
    if (!needsGrid(mode) || state.layout !== "row") return;
    state.layout = "grid";
    save();
    applyLayout();
  }

  function setDesired(i, mode) {
    state.slots[i].desired = mode;
    if (mode !== "farm") state.slots[i].pet = false; // chọn chế độ khác thì dừng Bắt thú (agent cũng tự dừng)
    save();
    refresh(i);
    if (state.slots[i].on) {
      ensureGrid(mode);
      send(i, mode);
    }
  }

  // Tên khung = tên nhân vật + cấp độ (đọc từ game). Chưa đọc được thì dùng thông tin lần trước, rồi mới đến tên mặc định.
  function slotTitle(i) {
    const s = state.slots[i];
    const l = live[i] || {};
    const name = (l.ready && l.hero) || s.hero || "";
    const lvl = (l.ready && l.lvl) || s.lvl || 0;
    const money = (l.ready ? (l.gold ? " · 💰 " + l.gold : "") + (l.knb ? " · KNB " + l.knb : "") : "");
    if (name) return name + (lvl ? " · Cấp " + lvl : "") + money;
    return (s.label || "Tài khoản " + (i + 1)) + (lvl ? " · Cấp " + lvl : "") + money;
  }

  function refresh(i) {
    const c = els[i];
    const d = state.slots[i].desired;
    c.mbtns.forEach((b) => b.classList.toggle("on", b.dataset.m === d));
    const pb = c.slot.querySelector("[data-pet]");
    if (pb) pb.classList.toggle("on", !!state.slots[i].pet);
    const l = live[i];
    const ttl = slotTitle(i);
    const who = l && l.ready && l.acct ? " · tk " + l.acct : "";
    if (c.title.textContent !== ttl + who) c.title.textContent = ttl + who;
    c.title.title = ttl + (l && l.ready && l.acct ? "\nTài khoản đăng nhập: " + l.acct + (l.dev ? "\nMã máy của game: " + l.dev + "…" : "") : "");
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    if (!state.slots[i].on) {
      c.st.textContent = "Đang tắt";
      c.st.title = "";
      return;
    }
    if (!l.ready) {
      c.st.textContent = "Chưa vào game";
      c.st.title = "";
      return;
    }
    // Một dòng gọn: chế độ hiện tại + thông báo mới nhất (cắt bớt bằng …). Rê chuột vào để xem đầy đủ.
    const modeTxt = "Đang: " + modeName(l.mode) + (l.next ? " → " + modeName(l.next) : "");
    c.st.innerHTML = "Đang: <b>" + esc(modeName(l.mode)) + "</b>" + (l.next ? " → " + esc(modeName(l.next)) : "") +
      (l.lastMsg ? " · " + esc(l.lastMsg) : "");
    c.st.title = [modeTxt, l.note, l.boss, l.pet, l.pd, l.sell, l.autoInfo].filter(Boolean).join("\n");
  }

  function mount(i, on) {
    const c = els[i];
    c.frame.textContent = "";
    c.iframe = null;
    live[i] = { mode: null, ready: false };
    if (on) {
      let f;
      if (APP) {
        f = document.createElement("webview");
        f.setAttribute("partition", "persist:acc" + state.slots[i].p);
        f.setAttribute("src", cfg.game);
        f.__q = [];
        f.__ready = false;
        f.addEventListener("did-start-loading", () => { f.__ready = false; });
        f.addEventListener("dom-ready", () => {
          f.__ready = true;
          const q = f.__q.splice(0);
          q.forEach((m) => { try { f.send("vl", m); } catch (e) {} });
          fitFrame(c);
        });
        f.addEventListener("ipc-message", (e) => {
          if (e.channel !== "vl") return;
          const j = els.findIndex((x) => x.iframe === f);
          if (j >= 0) onFrameMsg(j, e.args[0]);
        });
      } else {
        f = document.createElement("iframe");
        f.setAttribute("allow", "autoplay; fullscreen");
        f.src = frameUrl(i);
      }
      c.frame.appendChild(f);
      c.iframe = f;
      fitFrame(c);
    } else {
      const d = document.createElement("div");
      d.className = "off";
      d.textContent = "Khung đang tắt (bấm ⏻ để bật)";
      c.frame.appendChild(d);
    }
    refresh(i);
  }

  // Tin nhắn từ script trong khung game: hello (vừa tải xong) / status (chế độ hiện tại)
  window.addEventListener("message", (e) => {
    const m = e.data;
    if (!m || m.vl !== 1) return;
    const i = els.findIndex((c) => c.iframe && c.iframe.contentWindow === e.source);
    if (i < 0 || e.origin !== frameOrigin(i)) return;
    onFrameMsg(i, m);
  });
  function onFrameMsg(i, m) {
    if (!m || m.vl !== 1) return;
    if (m.type === "hello") {
      const d = state.slots[i].desired;
      if (d) { ensureGrid(d); send(i, d, true); }
      if (state.autoSell) sendAutoSell(i); // khung vừa tải lại: bật lại tự bán nếu đang bật
      if (state.slots[i].pet) sendPet(i, true); // và Bắt thú nếu khung này đang bật
    } else if (m.type === "events") {
      logEvents(i, m.lines);
    } else if (m.type === "status") {
      const prev = live[i] || {};
      const s = state.slots[i];
      // Nhớ tên + cấp lần cuối đọc được để lần sau mở trang vẫn hiện ngay
      if (m.ready && m.hero && s.hero !== m.hero) { s.hero = m.hero; save(); }
      if (m.ready && m.lvl > 0 && s.lvl !== m.lvl) { s.lvl = m.lvl; save(); }
      const nl = { hero: m.hero || "", lvl: m.lvl | 0, mode: m.mode, ready: !!m.ready, next: m.next || null, note: m.note || "", boss: m.boss || "", pet: m.pet || "", pd: m.pd || "", sell: m.sell || "", autoInfo: m.autoInfo || "", gold: m.gold || "", knb: m.knb || "", goldN: m.goldN, knbN: m.knbN, tower: m.tower | 0, black: !!m.black, acct: m.acct || "", dev: m.dev || "" };
      // Thông báo nào vừa đổi thì hiện làm thông báo mới nhất trên dòng trạng thái
      nl.lastMsg = prev.lastMsg || "";
      for (const k of ["note", "boss", "pet", "pd", "sell"]) if (nl[k] && nl[k] !== prev[k]) nl.lastMsg = nl[k];
      live[i] = nl;
      logSample(i, nl);
      // Bạn tự đổi chế độ ngay trong khung, hoặc tháp bị chặn -> đồng bộ lại lựa chọn
      if (m.sync && m.desired !== state.slots[i].desired) {
        state.slots[i].desired = m.desired;
        save();
      }
      refresh(i);
      renderBlack();
    }
  }

  // Game chỉ vẽ trọn bố cục ngang khi khung rộng từ ~640px; hẹp hơn thì chừa một dải đen bên phải. Ô lưới hẹp hơn mức đó (ví dụ 3 khung
  // trên của lưới 5 khung) thì cho game chạy ở bề rộng tối thiểu rồi thu nhỏ vừa ô. Chỉ áp dụng cho ô nằm ngang; bố cục 1 hàng (khung dọc) giữ nguyên.
  const GAME_MIN_W = 650;
  function fitFrame(c) {
    const f = c.iframe;
    if (!f) return;
    const w = c.frame.clientWidth, h = c.frame.clientHeight;
    if (APP) {
      // webview: không dùng transform mà thu nhỏ bằng zoom của trang, để game thấy khung rộng GAME_MIN_W và vẫn nhận chuột / bàn phím đúng
      const k = state.layout !== "row" && w > 0 && w < GAME_MIN_W && w >= h * 0.9 ? w / GAME_MIN_W : 1;
      if (f.__ready && f.__zoom !== k) {
        try { f.setZoomFactor(k); f.__zoom = k; } catch (e) {}
      }
      return;
    }
    if (state.layout !== "row" && w > 0 && w < GAME_MIN_W && w >= h * 0.9) {
      const k = w / GAME_MIN_W;
      f.style.width = GAME_MIN_W + "px";
      f.style.height = h / k + "px";
      f.style.transformOrigin = "0 0";
      f.style.transform = "scale(" + k + ")";
    } else {
      f.style.width = f.style.height = f.style.transform = f.style.transformOrigin = "";
    }
  }

  // ----- Tạo / xóa khung -----
  function createSlot(s) {
    const slot = document.createElement("section");
    slot.className = "slot";
    slot.innerHTML =
      '<div class="bar"><span class="num"></span>' +
      '<span class="label"></span>' +
      '<span class="pxst" hidden></span>' +
      '<button class="sm" data-a="px">🌐</button>' +
      '<button class="sm" data-a="cred" hidden>🔑</button>' +
      '<button class="sm" data-a="reload" title="Tải lại khung này">⟳</button>' +
      '<button class="sm" data-a="max" title="Phóng to / thu nhỏ">⛶</button>' +
      '<button class="sm" data-a="power" title="Tắt / bật khung (giảm tải máy)">⏻</button>' +
      '<button class="sm" data-a="del" title="Xóa khung này">✕</button></div>' +
      '<div class="modes">' +
      // Chỉ hiện biểu tượng cho gọn; rê chuột vào để xem tên nút
      MODES.map((m) => '<button class="sm" data-m="' + m[0] + '" title="' + m[2] + '" aria-label="' + m[2] + '">' + m[1] + '</button>').join("") +
      '<button class="sm" data-m="combo" title="Chạy PB + NV: làm hết Phó Bản, rồi Nhiệm Vụ, xong về Luyện Công hoặc Leo Tháp (chọn ở menu bên trái)" aria-label="Chạy tất cả">▶</button>' +
      '<button class="sm" data-boss title="Boss tuần: tự khiêu chiến đến hết lượt (bấm lần nữa để dừng)" aria-label="Boss tuần">👹</button>' +
      '<button class="sm" data-pet title="Bắt thú: bật / tắt đi tìm những loài thú chưa có trong Thú điển (đứng ở bãi có loài còn thiếu và luyện công)" aria-label="Bắt thú">🐾</button>' +
      '<button class="sm" data-sell title="Bán đồ xanh trong hành trang (đồ khóa, đồ đang mặc, đồ bạn đặt giữ được giữ lại)" aria-label="Bán đồ xanh">💰</button>' +
      '<button class="sm" data-sellhk title="Bán HK cơ bản: bán đồ Hoàng Kim cơ bản (Định Quốc, Hiệp Cốt, Kim Phong, Thiên Hoàng) lấy KNB khóa; giữ món khóa, món đã cường hóa và bộ khác" aria-label="Bán HK cơ bản">🛡</button>' +
      '<button class="sm" data-pdd title="Đóng bình PD: đóng hết Phúc Duyên chờ đóng thành bình Đại / Trung / Tiểu" aria-label="Đóng bình">🎐</button>' +
      '<button class="sm" data-pdu title="Dùng bình PD: dùng hết bình Phúc Duyên Lộ Đại / Trung / Tiểu trong hành trang (cộng điểm Phúc Duyên)" aria-label="Dùng bình">🧪</button>' +
      '<button class="sm" data-pdh title="Mở hồng bao: mở hết Hồng Bao và Đại Hồng Bao đang có (lượng / Kim Nguyên Bảo ngẫu nhiên)" aria-label="Mở hồng bao">🧧</button>' +
      '<button class="sm" data-pdo title="Mở hết PD: mở hết rương Phúc Duyên trong Phần thưởng (mỗi rương 10 điểm)" aria-label="Mở hết rương Phúc Duyên">🎁</button>' +
      '<span class="st"></span></div>' +
      '<div class="frame"></div>';
    main.appendChild(slot);
    const c = { slot, title: slot.querySelector(".label"), frame: slot.querySelector(".frame"), iframe: null, st: slot.querySelector(".st"), mbtns: [...slot.querySelectorAll("[data-m]")] };
    els.push(c);
    live.push({ mode: null, ready: false });
    // Chỉ số của khung có thể đổi khi xóa khung khác, nên luôn tra lại lúc bấm
    const idx = () => els.indexOf(c);
    c.mbtns.forEach((b) => (b.onclick = () => setDesired(idx(), b.dataset.m)));
    slot.querySelector("[data-boss]").onclick = () => sendBoss(idx());
    slot.querySelector("[data-pet]").onclick = () => setPet(idx(), !state.slots[idx()].pet);
    slot.querySelector("[data-sell]").onclick = () => sendSell(idx());
    slot.querySelector("[data-sellhk]").onclick = () => sendSellHk(idx());
    slot.querySelector("[data-pdd]").onclick = () => sendPd(idx(), "dong");
    slot.querySelector("[data-pdu]").onclick = () => sendPd(idx(), "dung");
    slot.querySelector("[data-pdo]").onclick = () => sendPd(idx(), "mo");
    slot.querySelector("[data-pdh]").onclick = () => sendPd(idx(), "hb");
    slot.querySelector('[data-a="reload"]').onclick = () => { const i = idx(); if (state.slots[i].on) mount(i, true); };
    slot.querySelector('[data-a="max"]').onclick = () => { const i = idx(); maxed = maxed === i ? -1 : i; applyLayout(); };
    slot.querySelector('[data-a="power"]').onclick = () => { const i = idx(); state.slots[i].on = !state.slots[i].on; save(); mount(i, state.slots[i].on); };
    slot.querySelector('[data-a="del"]').onclick = () => removeSlot(c);
    slot.querySelector('[data-a="px"]').onclick = () => setPx(idx());
    slot.querySelector('[data-a="cred"]').onclick = () => credOpen(idx());
    slot.querySelector(".pxst").onclick = () => pxCheck(state.slots[idx()].p);
    new ResizeObserver(() => fitFrame(c)).observe(c.frame);
    mount(els.length - 1, s.on);
    renderPx();
    return c;
  }

  // ----- Proxy riêng cho khung (đổi IP) -----
  // Chỉ khung chạy ở cổng số 5 (BASE_PORT + 5) có nút 🌐; các khung 1–4 luôn dùng IP máy này.
  const PX_PORT = 5;
  function renderPx() {
    els.forEach((c, i) => {
      const b = c.slot.querySelector('[data-a="px"]');
      b.hidden = state.slots[i].p !== PX_PORT;
      pxRenderStatus(c.slot.querySelector(".pxst"), state.slots[i].p);
      const u = pxList[state.slots[i].p];
      b.classList.toggle("on", !!u);
      b.title = u ? "Đang dùng proxy " + u + " (bấm để đổi / tắt)" : "Đặt proxy riêng cho khung này để đổi IP (khung chạy ở cổng " + (BASE_PORT + state.slots[i].p) + ")";
    });
    renderCred();
  }
  // Trạng thái kết nối proxy của khung 5: kết quả lần kiểm tra gần nhất (qua proxy tới game) + lỗi thật ghi nhận từ lưu lượng game
  let pxTest = {}, pxStat = {}, pxAuto = {};
  const pxSeenSw = {}; // lần tự đổi proxy gần nhất đã báo cho bạn, theo khung (lúc mới mở trang tính cả các lần đổi trong 10 phút qua)
  const pxSec = (ms) => (ms / 1000).toFixed(1).replace(".", ",") + "s";
  function pxRenderStatus(el, p) {
    el.hidden = p !== PX_PORT;
    if (el.hidden) return;
    const u = pxList[p], t = pxTest[p], st = pxStat[p] || {}, now = Date.now();
    let cls = "", txt, tip;
    if (!u) { txt = "○ chưa đặt proxy"; tip = "Khung này đang dùng IP máy. Bấm 🌐 để đặt proxy."; }
    else if (st.errAt && st.errAt > (st.okAt || 0) && now - st.errAt < 120000) {
      cls = "bad"; txt = "● proxy lỗi"; tip = "Lỗi khi game chạy qua proxy " + u + ": " + st.err + " (bấm để kiểm tra lại)" +
        (st.autoMsg ? "\n" + st.autoMsg : pxAuto[p] !== false ? "\nĐang tự tìm proxy khác nếu proxy này chết hẳn." : "");
    } else if (!t) { txt = "◌ đang kiểm tra…"; tip = u; }
    else if (t.error) { cls = "bad"; txt = "● không kết nối"; tip = "Proxy " + u + ": " + t.error + " (bấm để kiểm tra lại)"; }
    else if (t.proxy === t.direct) { cls = "warn"; txt = "● IP trùng máy"; tip = "Qua proxy " + u + " nhưng game vẫn thấy IP máy (" + t.proxy + ") — proxy chưa đổi được IP (bấm để kiểm tra lại)"; }
    else { cls = "ok"; txt = ["● ", t.proxy, pxSec(t.ms)]; tip = "Proxy " + u + " hoạt động: game thấy IP " + t.proxy + " (IP máy " + t.direct + "), phản hồi " + pxSec(t.ms) + ". Kiểm tra lúc " + new Date(t.at).toLocaleTimeString() + " (bấm để kiểm tra lại)" +
      (st.sw ? "\nĐã tự đổi proxy lúc " + new Date(st.sw.at).toLocaleTimeString() + ": " + st.sw.from + " chết → " + st.sw.to : ""); }
    el.className = "pxst" + (cls ? " " + cls : "");
    el.textContent = "";
    if (Array.isArray(txt)) {
      el.appendChild(document.createTextNode(txt[0]));
      const ip = document.createElement("span");
      ip.className = "ip";
      ip.textContent = txt[1] + " · ";
      el.appendChild(ip);
      el.appendChild(document.createTextNode(txt[2]));
    } else el.textContent = txt;
    el.title = tip;
  }
  async function pxCheck(p) {
    if (!pxList[p]) { delete pxTest[p]; renderPx(); return; }
    delete pxTest[p];
    renderPx();
    try {
      pxTest[p] = Object.assign(await pxPost("/__proxy/test", { slot: p }), { at: Date.now() });
    } catch (e) {
      pxTest[p] = { error: e.message, at: Date.now() };
    }
    await pxPoll();
  }
  async function pxPoll() {
    try {
      const r = await fetch("/__proxy", { cache: "no-store" });
      if (r.ok) { const j = await r.json(); pxList = j.slots || {}; pxStat = j.stat || {}; pxAuto = j.auto || {}; }
    } catch (e) {}
    // Máy chủ vừa tự đổi proxy chết sang proxy khác: báo cho bạn và kiểm tra lại proxy mới
    for (const [p, st] of Object.entries(pxStat)) {
      const sw = st && st.sw;
      if (!sw || sw.at <= (pxSeenSw[p] || Date.now() - 600000)) continue;
      pxSeenSw[p] = sw.at;
      const i = state.slots.findIndex((s) => String(s.p) === String(p));
      logToast("Proxy", "Khung " + (i >= 0 ? i + 1 : p) + ": proxy " + sw.from + " chết → đã tự đổi sang " + sw.to + " (IP " + sw.ip + ", " + pxSec(sw.ms) + ")");
      delete pxTest[p];
      if (+p === PX_PORT) pxCheck(+p);
    }
    renderPx();
  }
  setInterval(pxPoll, 10000); // lấy lỗi thật từ lưu lượng game
  setInterval(() => { if (state.slots.some((s) => s.p === PX_PORT && s.on)) pxCheck(PX_PORT); }, 60000);
  async function pxPost(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "x-vl": "1", "content-type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "lỗi " + r.status);
    return j;
  }
  // Áp dụng proxy cho khung i: body = { url } (nhập tay, để trống = tắt) hoặc { preset: id } (chọn từ danh sách)
  async function applyPx(i, body) {
    const p = state.slots[i].p;
    try {
      const j = await pxPost("/__proxy", Object.assign({ slot: p }, body));
      pxList = j.slots || {};
      renderPx();
      if (!pxList[p]) { delete pxTest[p]; renderPx(); logToast("Proxy", "Khung " + (i + 1) + ": đã tắt proxy (dùng IP máy này)"); }
      else {
        const t = await pxPost("/__proxy/test", { slot: p });
        pxTest[p] = Object.assign({}, t, { at: Date.now() });
        pxStat = {};
        renderPx();
        if (t.error) logToast("Proxy", "Khung " + (i + 1) + ": đã lưu nhưng kiểm tra lỗi — " + t.error);
        else if (t.proxy === t.direct) logToast("Proxy", "Khung " + (i + 1) + ": IP qua proxy " + t.proxy + " GIỐNG IP máy này — proxy chưa đổi được IP");
        else logToast("Proxy", "Khung " + (i + 1) + ": IP máy " + t.direct + " → IP qua proxy " + t.proxy);
      }
      if (state.slots[i].on) mount(i, true); // tải lại để khung dùng proxy mới
    } catch (e) {
      logToast("Proxy", "Khung " + (i + 1) + ": " + e.message);
    }
  }
  function manualPx(i) {
    const p = state.slots[i].p;
    const v = prompt(
      "Proxy cho khung " + (i + 1) + " (cổng " + (BASE_PORT + p) + ").\n" +
      "Dạng: http://user:pass@host:port  hoặc  socks5://user:pass@host:port\n" +
      "(Proxy MTProto của Telegram — Server / Port / Secret — không dùng được cho game.)\n" +
      (pxList[p] ? "Đang dùng: " + pxList[p] + "\n" : "") +
      "Để trống = tắt proxy cho khung này.",
      ""
    );
    if (v !== null) applyPx(i, { url: v.trim() });
  }

  // Hộp chọn proxy: danh sách chọn sẵn (proxy-presets.json + proxy-presets.local.json), tự kiểm tra sống / độ trễ khi mở
  const flag = (cc) => (/^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65)) : "🌐");
  const pxDlg = document.createElement("dialog");
  pxDlg.id = "pxDlg";
  pxDlg.innerHTML =
    '<div class="hd"><b class="ttl"></b><button class="sm" data-x="close" title="Đóng">✕</button></div>' +
    '<div class="cur"></div><div class="rows"></div>' +
    '<div class="ft"><button class="sm" data-x="test">⟳ Kiểm tra lại</button><button class="sm" data-x="manual">✎ Nhập tay…</button><button class="sm" data-x="off">⏻ Tắt proxy</button>' +
    '<label class="auto" title="Khi proxy không trả lời (và mạng máy vẫn thông), máy chủ tự kiểm tra danh sách chọn sẵn và đổi sang proxy sống nhanh nhất, ưu tiên cùng nước. Chạy cả khi bạn không mở trang quản lý."><input type="checkbox" data-x="auto"> Tự đổi proxy khác nếu proxy chết</label></div>';
  document.body.appendChild(pxDlg);
  let pxDlgSlot = -1, pxPresets = [], pxRes = {};
  const dq = (x) => pxDlg.querySelector(x);
  function pxRenderRows() {
    const p = pxDlgSlot >= 0 ? state.slots[pxDlgSlot].p : 0;
    dq(".cur").textContent = pxList[p] ? "Đang dùng: " + pxList[p] : "Đang dùng IP máy này (chưa đặt proxy)";
    dq("[data-x=auto]").checked = pxAuto[p] !== false;
    const order = pxPresets.slice().sort((a, b) => {
      const ra = pxRes[a.id], rb = pxRes[b.id];
      const ka = !ra ? 1 : ra.ok ? 0 : 2, kb = !rb ? 1 : rb.ok ? 0 : 2; // sống trước, chưa kiểm tra giữa, chết cuối
      return ka - kb || (ka === 0 ? ra.ms - rb.ms : a.id - b.id);
    });
    const rows = dq(".rows");
    rows.textContent = "";
    if (!order.length) rows.textContent = "Chưa có proxy chọn sẵn (thêm vào proxy-presets.json).";
    order.forEach((q) => {
      const r = pxRes[q.id];
      const b = document.createElement("button");
      b.className = "pxrow" + (pxList[p] === q.label ? " on" : "") + (r && !r.ok ? " dead" : "");
      const f = document.createElement("span"); f.className = "fl"; f.textContent = flag(q.country);
      const n = document.createElement("span"); n.className = "nm"; n.textContent = (q.country ? q.country + " · " : "") + q.label + (q.note ? "  (" + q.note + ")" : "");
      const m = document.createElement("span"); m.className = "ms";
      if (!r) m.textContent = "…";

  // Đổi lượng → KNB, Gửi hết KNB, Gửi đồ Hoàng Kim: bỏ qua khung 5 (khung chạy ở cổng 8805, thường là nhân vật nhận / giữ đồ)

  const guiKnbBtn = document.createElement("button");
  guiKnbBtn.textContent = "📨 Gửi hết KNB";
  guiKnbBtn.title = "Tất cả nhân vật (trừ khung 5): gửi hết Kim Nguyên Bảo đang có cho nhân vật ở ô trên bằng thư (KNB khóa không gửi được)";

    if (idxs.length && confirm("Gửi HẾT Kim Nguyên Bảo của " + idxs.length + " khung đang bật (trừ khung 5) cho nhân vật \"" + to + "\" qua thư?\n\nThư đã gửi không thể thu hồi.")) {

  guiHkBtn.onclick = () => {
    const idxs = moneySlots();

    if (idxs.length && confirm("Gửi HẾT đồ Hoàng Kim trong hành trang của " + idxs.length + " khung đang bật (trừ khung 5) cho nhân vật \"" + to + "\" qua thư?\n\nGồm cả món đã khóa 🔒 (game cho gửi thư món khóa). Đồ đang mặc, đồ Bạch Kim và đồ giữ cho Dã Tẩu được giữ lại. Thư đã gửi không thể thu hồi.")) {
      idxs.forEach((i) => post(i, { type: "pd", kind: "hk", to }));

  allBox.appendChild(guiHkBtn);


  // ----- Bố cục -----
  const lGrid = document.getElementById("lGrid");
  const lRow = document.getElementById("lRow");
  function applyLayout() {
    const n = els.length;
    main.className = maxed >= 0 ? "max" : "";
    let cols, rows;
    if (maxed >= 0) { cols = 1; rows = 1; }
    else if (state.layout === "row") { cols = n; rows = 1; }
    else if (n === 5) { cols = 6; rows = 2; } // 3 khung trên + 2 khung dưới (mỗi khung dưới rộng 3/6): không bỏ trống ô nào
    else { cols = Math.min(n, Math.ceil(Math.sqrt(n))); rows = Math.ceil(n / cols); } // 4 khung = 2×2, 6 khung = 3×2, 9 khung = 3×3
    main.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    main.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
    els.forEach((c, i) => { c.slot.style.gridColumn = maxed < 0 && cols === 6 ? (i < 3 ? "span 2" : "span 3") : ""; });
    els.forEach((c, i) => c.slot.classList.toggle("maxed", i === maxed));
    lGrid.classList.toggle("on", state.layout !== "row");
    lRow.classList.toggle("on", state.layout === "row");
  }
  lGrid.onclick = () => { state.layout = "grid"; maxed = -1; save(); applyLayout(); };
  lRow.onclick = () => { state.layout = "row"; maxed = -1; save(); applyLayout(); };
  document.getElementById("addSlot").onclick = addSlot;
  // --- Cập nhật từ GitHub: máy chủ tự kiểm tra, ở đây chỉ hỏi trạng thái và gửi lệnh cập nhật khi bạn bấm ---
  (() => {
    const box = document.getElementById("upd");
    const msg = document.getElementById("updMsg");
    const why = document.getElementById("updWhy");
    const go = document.getElementById("updGo");
    const later = document.getElementById("updLater");
    const HDR = { "x-vl": "1" };
    let dismissed = ""; // đã bấm "Để sau" cho bản nào
    let working = false;

    const render = (u) => {
      const sig = u.behind + ":" + (u.commits[0] || "");
      if (!u.supported || !u.behind || dismissed === sig) { box.hidden = true; return; }
      box.hidden = false;
      msg.textContent = "Có bản mới trên GitHub (" + u.behind + " thay đổi).";
      why.textContent = (u.dirty ? "⚠ Bạn đang sửa file trong thư mục này, cập nhật có thể báo lỗi. " : "") + u.commits.join(" · ");
      why.title = u.commits.join("\n");
      go.dataset.sig = sig;
    };
    const poll = async () => {
      if (working) return;
      try {
        const r = await fetch("/__update", { cache: "no-store" });
        if (r.ok) render(await r.json());
      } catch (e) {}
    };
    later.onclick = () => { dismissed = go.dataset.sig || ""; box.hidden = true; };
    go.onclick = async () => {
      if (!confirm("Cập nhật từ GitHub?\n\nTrang quản lý và các khung game sẽ được tải lại (chế độ đang chọn sẽ tự áp dụng lại).")) return;
      working = true;
      go.disabled = later.disabled = true;
      msg.textContent = "Đang cập nhật…";
      let err = "";
      try {
        const r = await fetch("/__update/apply", { method: "POST", headers: HDR });
        const u = await r.json();
        if (u.error) err = u.error;
      } catch (e) {
        // Máy chủ tự khởi động lại khi server.js đổi nên kết nối có thể đứt giữa chừng: đợi nó chạy lại rồi kiểm tra
      }
      for (let n = 0; n < 20; n++) {
        await new Promise((ok) => setTimeout(ok, 1000));
        try {
          const u = await (await fetch("/__update", { cache: "no-store" })).json();
          if (u.error) err = u.error;
          if (!u.behind) { if (window.vlApp) window.vlApp.relaunch(); else location.reload(); return; }
          if (!u.busy) break;
        } catch (e) {}
      }
      working = false;
      go.disabled = later.disabled = false;
      msg.textContent = "Cập nhật chưa thành công" + (err ? ": " + err : ".");
    };
    // Nút "Cập nhật" ở đầu trang: bắt máy chủ kiểm tra GitHub ngay; có bản mới thì hỏi và cập nhật luôn, không thì báo lý do / "đang dùng bản mới nhất"
    const now = document.getElementById("updNow");
    now.onclick = async () => {
      if (working) return;
      const label = now.textContent;
      now.disabled = true;
      now.textContent = "Đang kiểm tra…";
      const say = (t) => logToast("Cập nhật", t);
      try {
        const r = await fetch("/__update/check", { method: "POST", headers: HDR });
        const u = await r.json();
        if (!u.supported) say("Không dùng được: máy chủ không thấy git hoặc thư mục này không phải bản clone từ GitHub.");
        else if (u.error) say("Không kiểm tra được: " + u.error);
        else if (!u.behind) say("Đang dùng bản mới nhất" + (u.head ? " (" + u.head + ")" : "") + ".");
        else {
          dismissed = "";
          render(u);
          now.disabled = false;
          now.textContent = label;
          go.onclick(); // hỏi xác nhận rồi cập nhật
          return;
        }
      } catch (e) {
        say("Không kết nối được máy chủ cục bộ.");
      }
      now.disabled = false;
      now.textContent = label;
    };
    setTimeout(poll, 8000); // máy chủ kiểm tra lần đầu sau ~5 giây
    setInterval(poll, 5 * 60 * 1000);
  })();

  // --- Nhật ký hoạt động ---
  // Số liệu theo nhân vật (khóa = tên nhân vật), lưu trong localStorage của trình duyệt này, giữ 14 ngày gần nhất:
  //  - cấp tăng trong ngày: cộng các lần cấp tăng (đọc từ thanh trên của game)
  //  - lượng / Kim Nguyên Bảo kiếm được: cộng các lần SỐ TĂNG; chi: cộng các lần giảm (mua, đổi...). Số đọc từ bản lưu của game
  //    (chính xác); không có bản lưu thì không ghi.
  //  - tầng tháp leo được trong ngày: cộng phần tầng tăng so với tầng thấy lần trước, ra khỏi tháp vào lại thì đếm tiếp (đọc từ tên bãi trên thanh trên của game)
  //  - sự kiện đáng chú ý: dòng nhật ký game khớp LOG_NOTABLE trong agent.js (đồ phổ, Thần Mã)
  // Ngày tính theo giờ Việt Nam (GMT+7) như game.
  // v2: bản v1 có số liệu sai (mốc cấp 1 / 0 lượng lúc khung chưa nạp nhân vật, về sau bị tính thành "kiếm được" cả số đang có) nên bỏ hẳn
  const LOGKEY = "quanly4acc.log.v2";
  try { localStorage.removeItem("quanly4acc.log.v1"); } catch (e) {}
  const LOG_DAYS = 14;
  const LOG_EVENTS_MAX = 300;
  const LOG_GAP_MS = 6 * 3600e3;
  let logData = {};
  try { logData = JSON.parse(localStorage.getItem(LOGKEY) || "{}") || {}; } catch (e) { logData = {}; }
  let logDirty = false;
  let logUnread = 0;
  setInterval(() => {
    if (!logDirty) return;
    logDirty = false;
    try { localStorage.setItem(LOGKEY, JSON.stringify(logData)); } catch (e) {}
  }, 5000);
  window.addEventListener("pagehide", () => { try { localStorage.setItem(LOGKEY, JSON.stringify(logData)); } catch (e) {} });

  const vnDay = (t) => new Date((t || Date.now()) + 7 * 3600e3).toISOString().slice(0, 10);
  const vnTime = (t) => new Date(t + 7 * 3600e3).toISOString().slice(11, 16);
  const logKey = (i) => (live[i] && live[i].hero) || state.slots[i].hero || ("Khung " + (i + 1));
  const logChar = (key) => logData[key] || (logData[key] = { days: {}, events: [] });
  const logDay = (c, day) => c.days[day] || (c.days[day] = { lv0: 0, up: 0, earned: 0, spent: 0, knbIn: 0, knbOut: 0, tw: 0, twMax: 0 });
  const logTrim = (c) => {
    const keep = Object.keys(c.days).sort().slice(-LOG_DAYS);
    Object.keys(c.days).forEach((d) => { if (!keep.includes(d)) delete c.days[d]; });
    if (c.events.length > LOG_EVENTS_MAX) c.events.length = LOG_EVENTS_MAX;
  };

  function logSample(i, l) {
    if (!l.ready || !l.hero) return; // chưa đọc được tên nhân vật thì chưa biết ghi cho ai: bỏ qua, không ghi vào "Khung N"
    // Chỉ ghi khi có số liệu từ bản lưu của game. Chữ trên thanh trên còn số mặc định (cấp 1, 0 lượng) khi khung chưa được vẽ,
    // dùng làm mốc sẽ khiến lần đọc thật sau đó bị tính thành "tăng" cả số đang có.
    if (typeof l.goldN !== "number" || typeof l.knbN !== "number") return;
    const lvl = l.lvl | 0, gold = l.goldN, knb = l.knbN;
    const tw = l.tower | 0;
    if (!(lvl > 0) || gold == null || knb == null) return;
    const c = logChar(l.hero);
    const d = logDay(c, vnDay());
    const last = c.last;
    if (!d.lv0) d.lv0 = lvl;
    if (last && Date.now() - last.t < LOG_GAP_MS) { // đóng trang quá lâu thì chỉ đặt lại mốc, không tính chênh lệch
      if (lvl > last.lvl) d.up += lvl - last.lvl;
      const dg = gold - last.gold;
      if (dg > 0) d.earned += dg; else if (dg < 0) d.spent -= dg;
      const dk = knb - last.knb;
      if (dk > 0) d.knbIn += dk; else if (dk < 0) d.knbOut -= dk;
      // Tầng tháp: cộng phần tầng tăng so với tầng thấy lần trước (c.twPos). Ra khỏi tháp thì giữ nguyên mốc, vào lại
      // (game vào lại đúng tầng đã rời) thì đếm tiếp từ đó. Sang ngày mới số đếm về 0 nhưng mốc vẫn giữ.
      if (tw > 0 && (c.twPos | 0) > 0 && tw > c.twPos) d.tw = (d.tw | 0) + tw - c.twPos;
    }
    if (tw > 0) {
      d.twMax = Math.max(d.twMax | 0, tw);
      c.twPos = tw;
    }
    c.last = { lvl, gold, knb, t: Date.now() };
    c.lv = lvl;
    logTrim(c);
    logDirty = true;
  }

  function logEvents(i, lines) {
    if (!Array.isArray(lines)) return;
    const key = logKey(i);
    const c = logChar(key);
    const now = Date.now();
    lines.slice(0, 20).forEach((t) => {
      t = String(t).slice(0, 200);
      const top = c.events[0];
      if (top && top.text === t && now - top.t < 3000) return; // cùng một dòng đọc hai lần
      c.events.unshift({ t: now, text: t });
      logUnread++;
      logToast(key, t);
    });
    logTrim(c);
    logDirty = true;
    badge();
    if (!document.getElementById("logPanel").hidden) renderLog();
  }

  function logToast(key, text) {
    const box = document.getElementById("logToast");
    const d = document.createElement("div");
    const b = document.createElement("b");
    b.textContent = key + ": ";
    d.appendChild(b);
    d.appendChild(document.createTextNode(text));
    box.appendChild(d);
    while (box.children.length > 4) box.removeChild(box.firstChild);
    setTimeout(() => d.remove(), 10000);
  }
  const badge = () => { document.getElementById("logBadge").textContent = logUnread ? "(" + logUnread + ")" : ""; };

  const fmtNum = (n) => Math.round(n).toLocaleString("vi-VN");
  const fmtGold = (n) => (Math.abs(n) >= 1e4 ? fmtNum(n / 1e4) + " vạn" : fmtNum(n));
  let logSel = ""; // nhân vật đang xem ("" = tất cả)

  function renderLog() {
    const panel = document.getElementById("logPanel");
    const box = document.getElementById("logBox");
    const keepPanel = panel.scrollTop;
    const oldUl = box.querySelector("ul");
    const keepUl = oldUl ? oldUl.scrollTop : 0;
    box.textContent = "";
    requestAnimationFrame(() => { panel.scrollTop = keepPanel; const u = box.querySelector("ul"); if (u) u.scrollTop = keepUl; });
    const el = (tag, cls, text, parent) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      if (parent) parent.appendChild(e);
      return e;
    };
    const head = el("h2", "", "📒 Nhật ký hoạt động", box);
    el("span", "grow", "", head);
    const x = el("button", "sm", "✕ Đóng", head);
    x.onclick = () => { document.getElementById("logPanel").hidden = true; };

    const names = Object.keys(logData).sort();
    if (!names.length) {
      el("p", "dim", "Chưa có số liệu. Mở các khung game và đăng nhập, số liệu sẽ được ghi từ lúc đó.", box);
      return;
    }
    if (logSel && !names.includes(logSel)) logSel = "";
    const tabs = el("div", "tabs", "", box);
    ["", ...names].forEach((n) => {
      const b = el("button", "sm" + (n === logSel ? " on" : ""), n || "Tất cả", tabs);
      b.onclick = () => { logSel = n; renderLog(); };
    });
    const today = vnDay();
    const chars = logSel ? [logSel] : names;

    el("h3", "", "Hôm nay (" + today + ")", box);
    const t1 = el("table", "", "", box);
    const r0 = el("tr", "", "", t1);
    ["Nhân vật", "Cấp", "Cấp tăng", "Lượng kiếm", "Lượng chi", "KNB kiếm", "KNB chi", "Tầng tháp", "Tầng cao nhất"].forEach((h) => el("th", "", h, r0));
    const tot = { up: 0, earned: 0, spent: 0, knbIn: 0, knbOut: 0, tw: 0 };
    chars.forEach((n) => {
      const c = logData[n], d = c.days[today];
      if (d) Object.keys(tot).forEach((k) => { tot[k] += d[k] | 0; });
      const r = el("tr", "", "", t1);
      el("td", "", n, r);
      el("td", "", c.lv || "-", r);
      if (!d) { for (let k = 0; k < 7; k++) el("td", "dim", "-", r); return; }
      el("td", d.up ? "pos" : "dim", d.up ? "+" + d.up : "0", r);
      el("td", d.earned ? "pos" : "dim", fmtGold(d.earned), r);
      el("td", d.spent ? "neg" : "dim", fmtGold(d.spent), r);
      el("td", d.knbIn ? "pos" : "dim", fmtNum(d.knbIn), r);
      el("td", d.knbOut ? "neg" : "dim", fmtNum(d.knbOut), r);
      el("td", d.tw ? "pos" : "dim", d.tw ? "+" + d.tw : "0", r);
      el("td", d.twMax ? "" : "dim", d.twMax ? String(d.twMax) : "-", r);
    });
    if (chars.length > 1) { // hàng tổng: số tiền (ngân lượng) và các số khác của tất cả nhân vật trong ngày
      const r = el("tr", "tot", "", t1);
      el("td", "", "Tổng (" + chars.length + " nhân vật)", r);
      el("td", "dim", "-", r);
      el("td", tot.up ? "pos" : "dim", tot.up ? "+" + tot.up : "0", r);
      el("td", tot.earned ? "pos" : "dim", fmtGold(tot.earned), r);
      el("td", tot.spent ? "neg" : "dim", fmtGold(tot.spent), r);
      el("td", tot.knbIn ? "pos" : "dim", fmtNum(tot.knbIn), r);
      el("td", tot.knbOut ? "neg" : "dim", fmtNum(tot.knbOut), r);
      el("td", tot.tw ? "pos" : "dim", tot.tw ? "+" + tot.tw : "0", r);
      el("td", "dim", "-", r);
    }

    if (logSel) {
      const c = logData[logSel];
      el("h3", "", "Các ngày gần đây", box);
      const t2 = el("table", "", "", box);
      const h2 = el("tr", "", "", t2);
      ["Ngày", "Cấp tăng", "Lượng kiếm", "Lượng chi", "KNB kiếm", "Tầng tháp"].forEach((h) => el("th", "", h, h2));
      Object.keys(c.days).sort().reverse().forEach((day) => {
        const d = c.days[day], r = el("tr", "", "", t2);
        el("td", "", day, r);
        el("td", d.up ? "pos" : "dim", d.up ? "+" + d.up : "0", r);
        el("td", "", fmtGold(d.earned), r);
        el("td", "", fmtGold(d.spent), r);
        el("td", "", fmtNum(d.knbIn), r);
        el("td", d.tw ? "pos" : "dim", d.tw ? "+" + d.tw : "0", r);
      });
    }

    el("h3", "", "Sự kiện đáng chú ý" + (logSel ? "" : " (tất cả nhân vật)"), box);
    const evs = [];
    chars.forEach((n) => logData[n].events.forEach((e) => evs.push({ n, t: e.t, text: e.text })));
    evs.sort((a, b) => b.t - a.t);
    const ul = el("ul", "", "", box);
    if (!evs.length) el("li", "dim", "Chưa có. Ghi các dòng nhật ký có Đồ phổ, Thần Mã (cần khung thông báo của game ở tab Hệ thống, script tự chuyển sang tab này một lần khi tải khung).", ul);
    evs.slice(0, 100).forEach((e) => {
      const li = el("li", "", "", ul);
      el("time", "", e.t >= Date.parse(today + "T00:00:00+07:00") ? vnTime(e.t) : vnDay(e.t).slice(5) + " " + vnTime(e.t), li);
      if (!logSel) el("b", "", e.n + ": ", li);
      li.appendChild(document.createTextNode(e.text));
    });

    const clr = el("button", "sm", logSel ? "Xóa nhật ký của " + logSel : "Xóa toàn bộ nhật ký", box);
    clr.style.marginTop = "10px";
    clr.onclick = () => {
      if (!confirm(logSel ? "Xóa nhật ký của " + logSel + "?" : "Xóa nhật ký của tất cả nhân vật?")) return;
      if (logSel) delete logData[logSel]; else logData = {};
      logSel = "";
      logDirty = true;
      renderLog();
    };
  }
  document.getElementById("logBtn").onclick = () => {
    logUnread = 0;
    badge();
    const p = document.getElementById("logPanel");
    p.hidden = !p.hidden;
    if (!p.hidden) renderLog();
  };
  document.getElementById("logPanel").onclick = (e) => { if (e.target.id === "logPanel") e.target.hidden = true; };
  setInterval(() => { if (!document.getElementById("logPanel").hidden) renderLog(); }, 5000);

  // --- Hẹn giờ: nhiều lịch độc lập (mỗi lịch có giờ, ngày, khung và các việc riêng; ví dụ lịch Phó Bản và lịch Phúc Duyên), xong thì về Leo Tháp (hoặc Luyện Công) ---
  // Chạy ngay trong trang quản lý nên phải để ứng dụng mở. Đến giờ, mỗi khung đang bật và đã vào game nhận một lệnh "combo" (agent làm tuần tự và tự mua lệnh bài khi hết việc);
  // khung chưa vào game thì thử lại trong 10 phút (ví dụ đang tự đăng nhập lại), quá thì bỏ qua lần đó. Mỗi giờ hẹn chỉ chạy một lần mỗi ngày.
  const SCHED_GRACE_MS = 10 * 60 * 1000;
  const DAY_NAMES = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
  const newSchedId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const schedDefault = () => ({ id: newSchedId(), name: "Lịch mới", on: false, times: ["05:00"], days: [1, 1, 1, 1, 1, 1, 1], sell: true, dg: true, quest: true, buy: true, dong: false, dung: false, mo: false, hb: false, after: "tower", slots: null, last: {} });
  // Lịch mẫu thứ hai: chuỗi Phúc Duyên (đóng bình → dùng bình → mở hết rương → hồng bao → Nhiệm Vụ), có giờ riêng
  const schedPdDefault = () => Object.assign(schedDefault(), { name: "Phúc Duyên", times: ["06:00"], sell: false, dg: false, buy: false, dong: true, dung: true, mo: true, hb: true, quest: true });
  if (!Array.isArray(state.scheds) || !state.scheds.length) {
    // bản cũ chỉ có một lịch (state.sched): giữ nguyên làm lịch 1, thêm lịch Phúc Duyên (đang tắt)
    state.scheds = [Object.assign(schedDefault(), state.sched || {}, { name: "Phó Bản" }), schedPdDefault()];
    delete state.sched;
  }
  state.scheds = state.scheds.map((c) => Object.assign(schedDefault(), c, { last: c.last || {} }));
  let scSel = 0; // lịch đang xem trong hộp thoại
  const sc = () => state.scheds[Math.min(scSel, state.scheds.length - 1)];
  const pad2 = (n) => String(n).padStart(2, "0");
  const dayKey = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  const schedAt = (day, t) => { const [h, m] = String(t).split(":").map(Number); return new Date(day.getFullYear(), day.getMonth(), day.getDate(), h || 0, m || 0, 0); };
  const schedSteps = (c) => [c.sell && "bán đồ xanh + HK cơ bản", c.dg && "Phó Bản", c.buy && "mua lệnh bài Dã Tẩu", c.dong && "đóng bình PD", c.dung && "dùng bình PD", c.mo && "mở hết rương PD", c.hb && "mở hồng bao", c.quest && "Nhiệm Vụ"].filter(Boolean).concat(c.after === "tower" ? "Leo Tháp" : "Luyện Công");
  const schedStepKeys = (c) => [c.sell && "sell", c.dg && "dg", c.buy && "ldt", c.dong && "dong", c.dung && "dung", c.mo && "mo", c.hb && "hb", c.quest && "quest"].filter(Boolean);
  function schedNext(c) {
    const now = new Date();
    let best = null;
    for (let d = 0; d < 8; d++) {
      const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d);
      if (!c.days[day.getDay()]) continue;
      for (const t of c.times) {
        const at = schedAt(day, t);
        if (at > now && (!best || at < best)) best = at;
      }
    }
    return best;
  }
  const schedWhen = (nx) => DAY_NAMES[nx.getDay()] + " " + pad2(nx.getDate()) + "/" + pad2(nx.getMonth() + 1) + " " + pad2(nx.getHours()) + ":" + pad2(nx.getMinutes());
  function renderSched() {
    const b = document.getElementById("schedBtn");
    const on = state.scheds.filter((c) => c.on && c.times.length);
    b.textContent = "⏰ Hẹn giờ: " + (on.length ? (on.length === 1 ? on[0].times.join(", ") : on.length + " lịch bật") : "TẮT");
    b.classList.toggle("on", !!on.length);
    b.title = state.scheds.map((c) => {
      const nx = c.on ? schedNext(c) : null;
      return c.name + ": " + (c.on ? (nx ? "kế " + schedWhen(nx) : "chưa có giờ") : "tắt") + " (" + schedSteps(c).join(" → ") + ")";
    }).join("\n");
  }
  // Khung nào chạy: các khung đang bật (và đã chọn trong lịch). Trả về các khung đã gửi lệnh
  function schedLaunch(c, pending) {
    const done = [];
    for (const i of [...pending]) {
      const s = state.slots[i];
      if (!s || !s.on) { pending.delete(i); continue; }
      if (!live[i] || !live[i].ready) continue;
      ensureGrid("combo");
      s.desired = c.after === "tower" ? "tower" : "farm"; // nếu khung tải lại giữa chừng thì về thẳng chế độ cuối, không chạy lại từ đầu
      s.pet = false;
      save();
      refresh(i);
      post(i, { type: "setMode", mode: "combo", restore: false, after: c.after === "tower" ? "tower" : "farm", kept: !!state.sellKept, steps: schedStepKeys(c) });
      pending.delete(i);
      done.push(i);
    }
    return done;
  }
  const schedTargets = (c) => state.slots.map((s, i) => (s.on && (!c.slots || c.slots.includes(s.p)) ? i : -1)).filter((i) => i >= 0);
  const schedPending = {}; // giờ hẹn đang chờ khung vào game: key -> { c, set: Set(chỉ số khung), until }
  function schedStart(c, key, label) {
    const set = new Set(schedTargets(c));
    label = c.name + " · " + label;
    if (!set.size) { logToast("Hẹn giờ", label + ": không có khung nào đang bật để chạy"); return; }
    const done = schedLaunch(c, set);
    logToast("Hẹn giờ", label + ": bắt đầu " + schedSteps(c).join(" → ") + " ở " + done.length + " khung" + (set.size ? " (" + set.size + " khung chưa vào game, thử lại trong 10 phút)" : ""));
    if (set.size) schedPending[c.id + " " + key] = { c, set, until: Date.now() + SCHED_GRACE_MS, label };
  }
  function schedTick() {
    const now = Date.now();
    for (const [key, p] of Object.entries(schedPending)) {
      const done = schedLaunch(p.c, p.set);
      if (done.length) logToast("Hẹn giờ", p.label + ": khung " + done.map((i) => i + 1).join(", ") + " đã vào game, bắt đầu chạy");
      if (!p.set.size) delete schedPending[key];
      else if (now > p.until) {
        logToast("Hẹn giờ", p.label + ": khung " + [...p.set].map((i) => i + 1).join(", ") + " không vào game kịp, bỏ qua lần này");
        delete schedPending[key];
      }
    }
    const today = new Date();
    for (const c of state.scheds) {
      if (!c.on) continue;
      for (let back = 0; back <= 1; back++) { // hôm qua cũng xét để giờ hẹn sát nửa đêm không bị lỡ khi mở lại ứng dụng
        const day = new Date(today.getFullYear(), today.getMonth(), today.getDate() - back);
        if (!c.days[day.getDay()]) continue;
        for (const t of c.times) {
          const at = schedAt(day, t).getTime();
          const key = dayKey(day) + " " + t;
          if (now >= at && now - at <= SCHED_GRACE_MS && !c.last[key]) {
            c.last[key] = now;
            for (const k of Object.keys(c.last)) if (now - c.last[k] > 3 * 86400000) delete c.last[k];
            save();
            schedStart(c, key, "Giờ hẹn " + t);
          }
        }
      }
    }
    renderSched();
  }
  setInterval(schedTick, 15000);

  const scDlg = document.createElement("dialog");
  scDlg.id = "scDlg";
  document.body.appendChild(scDlg);
  const esc2 = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  function scRender() {
    scSel = Math.min(scSel, state.scheds.length - 1);
    const c = sc();
    const order = [1, 2, 3, 4, 5, 6, 0];
    scDlg.innerHTML =
      '<div class="hd"><b>⏰ Hẹn giờ tự động chạy</b><button class="sm" data-s="close" title="Đóng">✕</button></div>' +
      '<div class="row tabs">' + state.scheds.map((x, k) => '<button class="sm' + (k === scSel ? " on" : "") + '" data-s="tab" data-k="' + k + '">' + (x.on ? "● " : "○ ") + esc2(x.name) + '</button>').join("") +
      (state.scheds.length < 6 ? '<button class="sm" data-s="addsched" title="Thêm một lịch mới có giờ riêng">＋ Thêm lịch</button>' : "") + '</div>' +
      '<div class="row" style="margin-top:8px"><span style="font-size:13px">Tên lịch:</span><input type="text" data-s="name" maxlength="24" value="' + esc2(c.name) + '" style="flex:1">' +
      (state.scheds.length > 1 ? '<button class="sm" data-s="delsched" title="Xóa lịch này">🗑</button>' : "") + '</div>' +
      '<label style="margin-top:8px"><input type="checkbox" data-s="on"' + (c.on ? " checked" : "") + '> <b>Bật lịch này</b></label>' +
      '<h4>Giờ chạy (theo giờ máy này)</h4><div class="times">' +
      c.times.map((t, k) => '<div class="time"><input type="time" data-s="time" data-k="' + k + '" value="' + t + '"><button class="sm" data-s="deltime" data-k="' + k + '" title="Bỏ giờ này">✕</button></div>').join("") +
      '</div><div class="row" style="margin-top:6px"><button class="sm" data-s="addtime"' + (c.times.length >= 6 ? " disabled" : "") + '>＋ Thêm giờ</button></div>' +
      '<h4>Các ngày trong tuần</h4><div class="row">' + order.map((k) => '<label><input type="checkbox" data-s="day" data-k="' + k + '"' + (c.days[k] ? " checked" : "") + '> ' + DAY_NAMES[k] + '</label>').join("") + '</div>' +
      '<h4>Các việc, làm tuần tự</h4><div class="row">' +
      '<label title="Trước khi chạy: bán đồ xanh rồi bán HK cơ bản (Định Quốc, Hiệp Cốt, Kim Phong, Thiên Hoàng) để có chỗ trống trong hành trang. Giữ món khóa 🔒, đồ đang mặc, món cường hóa. Không hoàn tác"><input type="checkbox" data-s="sell"' + (c.sell ? " checked" : "") + '> Bán đồ xanh + HK cơ bản</label>' +
      '<label><input type="checkbox" data-s="dg"' + (c.dg ? " checked" : "") + '> Phó Bản</label>' +
      '<label title="Mua hết Lệnh Bài Dã Tẩu có thể mua bằng KNB khóa ở Kỳ Trân Các, không hoàn tác"><input type="checkbox" data-s="buy"' + (c.buy ? " checked" : "") + '> Mua lệnh bài Dã Tẩu</label>' +
      '<label title="Đóng bình Phúc Duyên (như nút Đóng bình PD)"><input type="checkbox" data-s="dong"' + (c.dong ? " checked" : "") + '> Đóng bình PD</label>' +
      '<label title="Dùng hết bình Phúc Duyên Lộ trong hành trang"><input type="checkbox" data-s="dung"' + (c.dung ? " checked" : "") + '> Dùng bình PD</label>' +
      '<label title="Mở hết rương Phúc Duyên"><input type="checkbox" data-s="mo"' + (c.mo ? " checked" : "") + '> Mở hết PD</label>' +
      '<label title="Mở hồng bao"><input type="checkbox" data-s="hb"' + (c.hb ? " checked" : "") + '> Mở hồng bao</label>' +
      '<label><input type="checkbox" data-s="quest"' + (c.quest ? " checked" : "") + '> Nhiệm Vụ</label></div>' +
      '<div class="row" style="margin-top:6px"><span style="font-size:13px">Xong thì về:</span><select data-s="after"><option value="tower"' + (c.after === "tower" ? " selected" : "") + '>Leo Tháp</option><option value="farm"' + (c.after !== "tower" ? " selected" : "") + '>Luyện Công</option></select></div>' +
      '<h4>Áp dụng cho các khung</h4><div class="row">' +
      state.slots.map((s, i) => '<label><input type="checkbox" data-s="slot" data-p="' + s.p + '"' + (!c.slots || c.slots.includes(s.p) ? " checked" : "") + '> Khung ' + (i + 1) + '</label>').join("") + '</div>' +
      '<div class="info"></div>' +
      '<div class="ft"><button class="sm" data-s="now">▶ Chạy thử ngay</button></div>';
    scInfo();
  }
  // Hai lịch chạy chồng giờ trên cùng một khung: lệnh sau ngắt lệnh trước, nên báo nếu giờ hai lịch đang bật cách nhau dưới 60 phút
  function scOverlap(c) {
    const mins = (t) => { const [h, m] = t.split(":").map(Number); return (h || 0) * 60 + (m || 0); };
    for (const o of state.scheds) {
      if (o === c || !o.on || !c.on) continue;
      if (!o.days.some((d, k) => d && c.days[k])) continue;
      if (o.slots && c.slots && !o.slots.some((p) => c.slots.includes(p))) continue;
      for (const a of c.times) for (const b of o.times) if (Math.abs(mins(a) - mins(b)) < 60) return o.name + " (" + b + ")";
    }
    return "";
  }
  function scInfo() {
    const c = sc();
    const nx = c.on ? schedNext(c) : null;
    const ov = scOverlap(c);
    scDlg.querySelector(".info").textContent =
      "Trình tự: " + schedSteps(c).join(" → ") + ".\n" +
      (c.on ? (nx ? "Lần chạy kế: " + schedWhen(nx) + "." : "Chưa có giờ / ngày nào được chọn.") : "Đang tắt.") +
      (ov ? "\n⚠ Giờ gần lịch \"" + ov + "\": lịch chạy sau sẽ ngắt lịch đang chạy trên cùng khung. Nên cách nhau đủ lâu." : "") +
      "\nChỉ chạy khi ứng dụng đang mở, và chỉ với khung đang bật và đã vào game (khung chưa vào game được thử lại trong 10 phút).";
  }
  scDlg.onchange = (e) => {
    const x = e.target.closest("[data-s]");
    if (!x) return;
    const c = sc(), k = parseInt(x.dataset.k, 10);
    switch (x.dataset.s) {
      case "on": c.on = x.checked; break;
      case "name": c.name = x.value.trim() || "Lịch"; break;
      case "time": if (/^\d{2}:\d{2}$/.test(x.value)) c.times[k] = x.value; break;
      case "day": c.days[k] = x.checked ? 1 : 0; break;
      case "sell": case "dg": case "quest": case "buy": case "dong": case "dung": case "mo": case "hb": c[x.dataset.s] = x.checked; break;
      case "after": c.after = x.value === "tower" ? "tower" : "farm"; break;
      case "slot": {
        const all = state.slots.map((s) => s.p), cur = new Set(c.slots || all);
        x.checked ? cur.add(+x.dataset.p) : cur.delete(+x.dataset.p);
        c.slots = all.every((p) => cur.has(p)) ? null : [...cur];
        break;
      }
    }
    save();
    renderSched();
    if (x.dataset.s === "on" || x.dataset.s === "name") scRender(); else scInfo();
  };
  scDlg.onclick = (e) => {
    const x = e.target.closest("[data-s]");
    if (e.target === scDlg || (x && x.dataset.s === "close")) return scDlg.close();
    if (!x) return;
    const c = sc();
    if (x.dataset.s === "addtime" && c.times.length < 6) { c.times.push("12:00"); save(); renderSched(); scRender(); }
    else if (x.dataset.s === "deltime") { c.times.splice(parseInt(x.dataset.k, 10), 1); save(); renderSched(); scRender(); }
    else if (x.dataset.s === "tab") { scSel = parseInt(x.dataset.k, 10) || 0; scRender(); }
    else if (x.dataset.s === "addsched" && state.scheds.length < 6) { state.scheds.push(Object.assign(schedDefault(), { name: "Lịch " + (state.scheds.length + 1) })); scSel = state.scheds.length - 1; save(); renderSched(); scRender(); }
    else if (x.dataset.s === "delsched") {
      if (state.scheds.length < 2 || !confirm("Xóa lịch \"" + c.name + "\"?")) return;
      state.scheds.splice(scSel, 1);
      scSel = Math.max(0, scSel - 1);
      save(); renderSched(); scRender();
    }
    else if (x.dataset.s === "now") {
      if (!schedTargets(c).length) { logToast("Hẹn giờ", "Không có khung nào đang bật"); return; }
      if (!confirm("Chạy ngay lịch \"" + c.name + "\": " + schedSteps(c).join(" → ") + " ở " + schedTargets(c).length + " khung đang bật?" + ((c.buy ? "\n\nMua lệnh bài Dã Tẩu dùng KNB khóa, không hoàn tác." : "") + (c.sell ? "\n\nBán đồ xanh + HK cơ bản không hoàn tác." : "")))) return;
      scDlg.close();
      schedStart(c, "manual " + Date.now(), "Chạy thử");
    }
  };
  document.getElementById("schedBtn").onclick = () => { scRender(); scDlg.showModal(); };
  renderSched();

  // Màn hình đen cho cả các khung đang bật. Khung đã đen thì lần bấm sau tắt hết; game tự nhớ lựa chọn nên tải lại khung vẫn giữ.
  const blackBtn = document.getElementById("blackBtn");
  const anyBlack = () => state.slots.some((s, i) => s.on && live[i] && live[i].black);
  function renderBlack() {
    const on = anyBlack();
    blackBtn.textContent = "🌑 Màn hình đen: " + (on ? "BẬT" : "TẮT");
    blackBtn.classList.toggle("on", on);
  }
  blackBtn.onclick = () => {
    const on = !anyBlack();
    forOn((i) => post(i, { type: "black", on }));
  };
  renderBlack();
  document.getElementById("reloadAll").onclick = () => state.slots.forEach((s, i) => s.on && mount(i, true));
  afterCountChange();
})();
</script>
</body>
</html>
