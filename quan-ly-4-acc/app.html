<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý nhân vật</title>
<style>
  :root { --bg:#0e1412; --panel:#151d1a; --line:#2a3a34; --text:#e6e0d0; --dim:#8a9a92; --accent:#d8b04a; --ok:#6fcf8c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  /* Menu dọc bên trái: các nút chung của app. Màn hình hẹp (<= 900px) thì xếp ngang phía trên như trước. */
  #shell { flex: 1; min-height: 0; display: flex; }
  #side { width: 172px; flex: none; display: flex; flex-direction: column; gap: 3px; padding: 6px; overflow-y: auto; border-right: 1px solid var(--line); background: #101815; }
  #side h1 { font-size: 13px; margin: 0 0 4px; color: var(--accent); font-weight: 600; }
  #side button { width: 100%; padding: 2px 8px; font-size: 12px; line-height: 1.5; text-align: left; }
  #side label { font-size: 12px; }
  #side input[type=text], #side input[type=number] { width: 100%; padding: 2px 6px; font-size: 12px; background: #0e1412; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
  #side select { width: 100%; padding: 2px 4px; font-size: 12px; background: #1d2a25; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
  .grp { display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
  .grp > span { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .sep { height: 1px; background: var(--line); margin: 4px 0; flex: none; }
  .grow { flex: 1; }
  #content { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  button { background:#1d2a25; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:disabled:hover { border-color: var(--line); }
  button.on { background:#2b3d34; border-color:var(--accent); color:var(--accent); }
  button.sm { padding: 1px 7px; }

  /* Số cột / hàng được đặt bằng JS theo số khung */
  main { flex:1; min-height:0; display:grid; gap:5px; padding:5px; }
  main.max .slot:not(.maxed) { display: none; }

  .slot { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:6px; padding:3px 6px; border-bottom:1px solid var(--line); }
  .num { flex:none; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#1a1a10; font-weight:700; text-align:center; line-height:20px; font-size:12px; }
  .bar .label { flex:1; min-width:0; color:var(--text); font-weight:600; padding:2px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .label small { color:var(--dim); font-weight:400; }
  .modes { display:flex; align-items:center; gap:3px; padding:2px 5px; border-bottom:1px solid var(--line); flex-wrap: wrap; }
  .modes button.sm { padding:1px 5px; line-height:1.5; }
  .modes .st { flex:1 1 90px; min-width:0; margin-left:4px; color:var(--dim); font-size:12px; text-align:right;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .modes .st b { color:var(--ok); font-weight:600; }
  .frame { position:relative; flex:1; min-height:0; background:#000; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .off { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); background:#0a0f0d; }
  #upd { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:3px 10px; background:#2b2a14; border-bottom:1px solid var(--accent); color:var(--accent); font-size:12px; }
  #upd[hidden] { display:none; }
  #upd .why { color:var(--dim); flex:1 1 200px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #logPanel { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow:auto; }
  #logPanel[hidden] { display:none; }
  #logBox { width:min(900px,100%); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px 14px; }
  #logBox h2 { margin:0 0 8px; font-size:15px; color:var(--accent); display:flex; align-items:center; gap:8px; }
  #logBox h2 .grow { flex:1; }
  #logBox h3 { margin:12px 0 4px; font-size:13px; color:var(--accent); font-weight:600; }
  #logBox table { width:100%; border-collapse:collapse; font-size:12px; }
  #logBox th, #logBox td { text-align:right; padding:2px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  #logBox th:first-child, #logBox td:first-child { text-align:left; }
  #logBox th { color:var(--dim); font-weight:400; }
  #logBox tr.tot td { font-weight:600; border-top:1px solid var(--accent); }
  #logBox .pos { color:var(--ok); } #logBox .neg { color:#e27a6a; } #logBox .dim { color:var(--dim); }
  #logBox ul { list-style:none; margin:0; padding:0; max-height:42vh; overflow:auto; font-size:12px; }
  #logBox li { padding:2px 0; border-bottom:1px solid var(--line); } #logBox li time { color:var(--dim); margin-right:6px; }
  #logBox .tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
  #logToast { position:fixed; right:12px; bottom:12px; z-index:60; display:flex; flex-direction:column; gap:6px; max-width:min(420px,90vw); }
  #logToast div { background:#2b2a14; border:1px solid var(--accent); color:var(--text); border-radius:6px; padding:6px 10px; font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.5); }
  #logToast b { color:var(--accent); }
  footer { padding:3px 10px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); }
  @media (max-width: 900px) {
    #shell { flex-direction: column; }
    #side { width: auto; max-height: 45vh; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
    #side button { width: auto; }
    .grp { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .sep { width: 1px; height: auto; align-self: stretch; margin: 0 2px; }
    main { grid-template-columns:1fr !important; grid-template-rows:none !important; overflow-y:auto; }
    .slot { height:80vh; }
  }
</style>
</head>
<body>
<div id="shell">
<aside id="side">
  <h1 id="title">Quản lý nhân vật</h1>
  <div class="grp">
    <button id="lGrid" title="Chia lưới (4 khung = 2×2)">Lưới</button>
    <button id="lRow" title="Tất cả khung cạnh nhau trong một hàng">1 hàng</button>
    <button id="addSlot" title="Thêm một khung game mới">＋ Thêm khung</button>
  </div>
  <span class="sep"></span>
  <div class="grp" id="allModes"><span>Tất cả:</span></div>
  <span class="grow"></span>
  <button id="updNow" title="Kiểm tra bản mới trên GitHub ngay (không cần chờ thông báo) và cập nhật nếu có">⬆ Cập nhật</button>
  <button id="logBtn" title="Nhật ký hoạt động của từng nhân vật: cấp tăng, ngân lượng kiếm được trong ngày, đồ đáng chú ý">📒 Nhật ký <small id="logBadge"></small></button>
  <button id="reloadAll" title="Tải lại tất cả khung game">⟳ Tải lại</button>
</aside>
<div id="content">
<div id="upd" hidden>
  <span id="updMsg"></span>
  <span class="why" id="updWhy"></span>
  <button id="updGo" class="sm" title="Tải bản mới từ GitHub (git pull) rồi tải lại trang">Cập nhật</button>
  <button id="updLater" class="sm" title="Ẩn thông báo cho đến khi có bản mới hơn">Để sau</button>
</div>
<div id="logPanel" hidden><div id="logBox"></div></div>
<div id="logToast"></div>
<main id="main"></main>
<footer id="foot"></footer>
</div>
</div>

<script>
(async () => {
  // Cấu hình từ máy chủ: cổng gốc và số cổng đã mở (mỗi khung cần một cổng riêng). Máy chủ cũ không có thì mặc định 4.
  let cfg = { base: 8800, max: 4 };
  try {
    const r = await fetch("/__config", { cache: "no-store" });
    if (r.ok) cfg = Object.assign(cfg, await r.json());
  } catch (e) {}
  const BASE_PORT = cfg.base | 0 || 8800;
  const MAX_SLOTS = Math.max(1, cfg.max | 0 || 4);

  const KEY = "quanly4acc.app.v2";
  const MODES = [
    ["farm", "⚔", "Luyện Công"],
    ["quest", "📜", "Nhiệm Vụ"],
    ["dg", "🏯", "Phó Bản"],
    ["tower", "🗼", "Leo Tháp"],
  ];
  const modeName = (m) => (MODES.find((x) => x[0] === m) || [0, 0, m || "—"])[2];

  // Mỗi khung có một số cổng p cố định (cổng = BASE_PORT + p) nên phiên đăng nhập không bị lẫn khi thêm / xóa khung.
  const frameOrigin = (i) => location.protocol + "//" + location.hostname + ":" + (BASE_PORT + state.slots[i].p);
  const frameUrl = (i) => frameOrigin(i) + "/";

  let state = {
    layout: "grid",
    slots: Array.from({ length: Math.min(4, MAX_SLOTS) }, (_, i) => ({ label: "Tài khoản " + (i + 1), on: true, desired: null, p: i + 1 })),
  };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && Array.isArray(s.slots) && s.slots.length >= 1) state = s;
  } catch (e) {}
  // Dữ liệu cũ chưa có số cổng: khung thứ i dùng cổng i+1 như trước. Bỏ khung dư nếu máy chủ mở ít cổng hơn.
  {
    const used = new Set();
    state.slots.forEach((s, i) => {
      if (!(s.p >= 1) || used.has(s.p)) s.p = i + 1;
      used.add(s.p);
    });
    state.slots = state.slots.filter((s) => s.p <= MAX_SLOTS);
    if (!state.slots.length) state.slots = [{ label: "Tài khoản 1", on: true, desired: null, p: 1 }];
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const main = document.getElementById("main");
  let maxed = -1;
  const els = []; // song song với state.slots
  const live = []; // trạng thái nhận từ từng khung, song song với state.slots

  function post(i, msg) {
    const f = els[i] && els[i].iframe;
    if (!f || !f.contentWindow) return;
    try { f.contentWindow.postMessage(Object.assign({ vl: 1 }, msg), frameOrigin(i)); } catch (e) {}
  }
  const send = (i, mode, restore) => post(i, { type: "setMode", mode, restore: !!restore, after: state.comboAfter === "tower" ? "tower" : "farm" });

  const sendPd = (i, kind) => post(i, { type: "pd", kind });

  const sendSell = (i) => post(i, { type: "sell", kept: !!state.sellKept });
  const sendAutoSell = (i) => post(i, { type: "autoSell", on: !!state.autoSell, kept: !!state.sellKept });
  const sendBoss = (i) => post(i, { type: "boss" });
  const sendPet = (i, on) => post(i, { type: "pet", on: !!on });
  // Bắt thú bật / tắt theo từng khung (nhớ lại sau khi tải lại khung, giống Tự bán)
  function setPet(i, on) {
    state.slots[i].pet = !!on;
    save();
    refresh(i);
    if (state.slots[i].on) sendPet(i, on);
    if (typeof renderPetBtn === "function") renderPetBtn();
  }

  // Nhiệm Vụ / Phó Bản (kể cả Chạy tất cả) cần khung đủ rộng để game vẽ khung "Theo Dấu": bố cục 1 hàng làm khung
  // quá hẹp nên tự chuyển về lưới. Chỉ đổi từ 1 hàng sang lưới, không đụng tới khung đang phóng to.
  const needsGrid = (mode) => mode === "quest" || mode === "dg" || mode === "combo";
  function ensureGrid(mode) {
    if (!needsGrid(mode) || state.layout !== "row") return;
    state.layout = "grid";
    save();
    applyLayout();
  }

  function setDesired(i, mode) {
    state.slots[i].desired = mode;
    if (mode !== "farm") state.slots[i].pet = false; // chọn chế độ khác thì dừng Bắt thú (agent cũng tự dừng)
    save();
    refresh(i);
    if (state.slots[i].on) {
      ensureGrid(mode);
      send(i, mode);
    }
  }

  // Tên khung = tên nhân vật + cấp độ (đọc từ game). Chưa đọc được thì dùng thông tin lần trước, rồi mới đến tên mặc định.
  function slotTitle(i) {
    const s = state.slots[i];
    const l = live[i] || {};
    const name = (l.ready && l.hero) || s.hero || "";
    const lvl = (l.ready && l.lvl) || s.lvl || 0;
    const money = (l.ready ? (l.gold ? " · 💰 " + l.gold : "") + (l.knb ? " · KNB " + l.knb : "") : "");
    if (name) return name + (lvl ? " · Cấp " + lvl : "") + money;
    return (s.label || "Tài khoản " + (i + 1)) + (lvl ? " · Cấp " + lvl : "") + money;
  }

  function refresh(i) {
    const c = els[i];
    const d = state.slots[i].desired;
    c.mbtns.forEach((b) => b.classList.toggle("on", b.dataset.m === d));
    const pb = c.slot.querySelector("[data-pet]");
    if (pb) pb.classList.toggle("on", !!state.slots[i].pet);
    const l = live[i];
    const ttl = slotTitle(i);
    if (c.title.textContent !== ttl) c.title.textContent = ttl;
    c.title.title = ttl;
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    if (!state.slots[i].on) {
      c.st.textContent = "Đang tắt";
      c.st.title = "";
      return;
    }
    if (!l.ready) {
      c.st.textContent = "Chưa vào game";
      c.st.title = "";
      return;
    }
    // Một dòng gọn: chế độ hiện tại + thông báo mới nhất (cắt bớt bằng …). Rê chuột vào để xem đầy đủ.
    const modeTxt = "Đang: " + modeName(l.mode) + (l.next ? " → " + modeName(l.next) : "");
    c.st.innerHTML = "Đang: <b>" + esc(modeName(l.mode)) + "</b>" + (l.next ? " → " + esc(modeName(l.next)) : "") +
      (l.lastMsg ? " · " + esc(l.lastMsg) : "");
    c.st.title = [modeTxt, l.note, l.boss, l.pet, l.pd, l.sell, l.autoInfo].filter(Boolean).join("\n");
  }

  function mount(i, on) {
    const c = els[i];
    c.frame.textContent = "";
    c.iframe = null;
    live[i] = { mode: null, ready: false };
    if (on) {
      const f = document.createElement("iframe");
      f.setAttribute("allow", "autoplay; fullscreen");
      f.src = frameUrl(i);
      c.frame.appendChild(f);
      c.iframe = f;
    } else {
      const d = document.createElement("div");
      d.className = "off";
      d.textContent = "Khung đang tắt (bấm ⏻ để bật)";
      c.frame.appendChild(d);
    }
    refresh(i);
  }

  // Tin nhắn từ script trong khung game: hello (vừa tải xong) / status (chế độ hiện tại)
  window.addEventListener("message", (e) => {
    const m = e.data;
    if (!m || m.vl !== 1) return;
    const i = els.findIndex((c) => c.iframe && c.iframe.contentWindow === e.source);
    if (i < 0 || e.origin !== frameOrigin(i)) return;
    if (m.type === "hello") {
      const d = state.slots[i].desired;
      if (d) { ensureGrid(d); send(i, d, true); }
      if (state.autoSell) sendAutoSell(i); // khung vừa tải lại: bật lại tự bán nếu đang bật
      if (state.slots[i].pet) sendPet(i, true); // và Bắt thú nếu khung này đang bật
    } else if (m.type === "events") {
      logEvents(i, m.lines);
    } else if (m.type === "status") {
      const prev = live[i] || {};
      const s = state.slots[i];
      // Nhớ tên + cấp lần cuối đọc được để lần sau mở trang vẫn hiện ngay
      if (m.ready && m.hero && s.hero !== m.hero) { s.hero = m.hero; save(); }
      if (m.ready && m.lvl > 0 && s.lvl !== m.lvl) { s.lvl = m.lvl; save(); }
      const nl = { hero: m.hero || "", lvl: m.lvl | 0, mode: m.mode, ready: !!m.ready, next: m.next || null, note: m.note || "", boss: m.boss || "", pet: m.pet || "", pd: m.pd || "", sell: m.sell || "", autoInfo: m.autoInfo || "", gold: m.gold || "", knb: m.knb || "", goldN: m.goldN, knbN: m.knbN, tower: m.tower | 0 };
      // Thông báo nào vừa đổi thì hiện làm thông báo mới nhất trên dòng trạng thái
      nl.lastMsg = prev.lastMsg || "";
      for (const k of ["note", "boss", "pet", "pd", "sell"]) if (nl[k] && nl[k] !== prev[k]) nl.lastMsg = nl[k];
      live[i] = nl;
      logSample(i, nl);
      // Bạn tự đổi chế độ ngay trong khung, hoặc tháp bị chặn -> đồng bộ lại lựa chọn
      if (m.sync && m.desired !== state.slots[i].desired) {
        state.slots[i].desired = m.desired;
        save();
      }
      refresh(i);
    }
  });

  // ----- Tạo / xóa khung -----
  function createSlot(s) {
    const slot = document.createElement("section");
    slot.className = "slot";
    slot.innerHTML =
      '<div class="bar"><span class="num"></span>' +
      '<span class="label"></span>' +
      '<button class="sm" data-a="reload" title="Tải lại khung này">⟳</button>' +
      '<button class="sm" data-a="max" title="Phóng to / thu nhỏ">⛶</button>' +
      '<button class="sm" data-a="power" title="Tắt / bật khung (giảm tải máy)">⏻</button>' +
      '<button class="sm" data-a="del" title="Xóa khung này">✕</button></div>' +
      '<div class="modes">' +
      // Chỉ hiện biểu tượng cho gọn; rê chuột vào để xem tên nút
      MODES.map((m) => '<button class="sm" data-m="' + m[0] + '" title="' + m[2] + '" aria-label="' + m[2] + '">' + m[1] + '</button>').join("") +
      '<button class="sm" data-m="combo" title="Chạy PB + NV: làm hết Phó Bản, rồi Nhiệm Vụ, xong về Luyện Công hoặc Leo Tháp (chọn ở menu bên trái)" aria-label="Chạy tất cả">▶</button>' +
      '<button class="sm" data-boss title="Boss tuần: tự khiêu chiến đến hết lượt (bấm lần nữa để dừng)" aria-label="Boss tuần">👹</button>' +
      '<button class="sm" data-pet title="Bắt thú: bật / tắt đi tìm những loài thú chưa có trong Thú điển (đứng ở bãi có loài còn thiếu và luyện công)" aria-label="Bắt thú">🐾</button>' +
      '<button class="sm" data-sell title="Bán Xanh + HK cơ bản: bán đồ xanh và đồ Hoàng Kim cơ bản (Định Quốc, Hiệp Cốt, Kim Phong, Thiên Hoàng; lấy KNB khóa) trong hành trang (đồ khóa, đồ đang mặc, đồ cường hóa, đồ bạn đặt giữ được giữ lại)" aria-label="Bán Xanh + HK cơ bản">💰</button>' +
      '<button class="sm" data-pdd title="Đóng bình PD: đóng hết Phúc Duyên chờ đóng thành bình Đại / Trung / Tiểu" aria-label="Đóng bình">🎐</button>' +
      '<button class="sm" data-pdu title="Dùng bình PD: dùng hết bình Phúc Duyên Lộ Đại / Trung / Tiểu trong hành trang (cộng điểm Phúc Duyên)" aria-label="Dùng bình">🧪</button>' +
      '<button class="sm" data-pdh title="Mở hồng bao: mở hết Hồng Bao và Đại Hồng Bao đang có (lượng / Kim Nguyên Bảo ngẫu nhiên)" aria-label="Mở hồng bao">🧧</button>' +
      '<button class="sm" data-pdo title="Mở hết PD: mở hết rương Phúc Duyên trong Phần thưởng (mỗi rương 10 điểm)" aria-label="Mở hết rương Phúc Duyên">🎁</button>' +
      '<span class="st"></span></div>' +
      '<div class="frame"></div>';
    main.appendChild(slot);

    slot.querySelector("[data-pdh]").onclick = () => sendPd(idx(), "hb");
    slot.querySelector('[data-a="reload"]').onclick = () => { const i = idx(); if (state.slots[i].on) mount(i, true); };

    mount(els.length - 1, s.on);

  function addSlot() {
    if (state.slots.length >= MAX_SLOTS) return;
    const used = new Set(state.slots.map((s) => s.p));
    let p = 1;
    while (used.has(p)) p++;
    if (p > MAX_SLOTS) return;
    const s = { label: "Tài khoản " + (state.slots.length + 1), on: true, desired: null, p };
    state.slots.push(s);
    save();
    createSlot(s);
    afterCountChange();
  }

  function removeSlot(c) {
    const i = els.indexOf(c);
    if (i < 0 || els.length <= 1) return;
    const s = state.slots[i];
    if (!confirm(
      "Xóa khung " + (i + 1) + " (" + slotTitle(i) + ")?\n\nGame trong khung sẽ đóng lại. " +
      "Phiên đăng nhập của khung này vẫn nằm trong trình duyệt (cổng " + (BASE_PORT + s.p) + "): nếu sau này thêm khung mới dùng lại cổng này, " +

    c.frame.textContent = ""; // dừng game trong khung
    c.slot.remove();
    els.splice(i, 1);
    live.splice(i, 1);

    else if (state.layout === "row") { cols = n; rows = 1; }

  // --- Cập nhật từ GitHub: máy chủ tự kiểm tra, ở đây chỉ hỏi trạng thái và gửi lệnh cập nhật khi bạn bấm ---
  (() => {
    const box = document.getElementById("upd");
    const msg = document.getElementById("updMsg");
    const why = document.getElementById("updWhy");
    const go = document.getElementById("updGo");
    const later = document.getElementById("updLater");
    const HDR = { "x-vl": "1" };
    let dismissed = ""; // đã bấm "Để sau" cho bản nào
    let working = false;

    const render = (u) => {
      const sig = u.behind + ":" + (u.commits[0] || "");
      if (!u.supported || !u.behind || dismissed === sig) { box.hidden = true; return; }
      box.hidden = false;
      msg.textContent = "Có bản mới trên GitHub (" + u.behind + " thay đổi).";
      why.textContent = (u.dirty ? "⚠ Bạn đang sửa file trong thư mục này, cập nhật có thể báo lỗi. " : "") + u.commits.join(" · ");
      why.title = u.commits.join("\n");
      go.dataset.sig = sig;
    };
    const poll = async () => {
      if (working) return;
      try {
        const r = await fetch("/__update", { cache: "no-store" });
        if (r.ok) render(await r.json());
      } catch (e) {}
    };
    later.onclick = () => { dismissed = go.dataset.sig || ""; box.hidden = true; };
    go.onclick = async () => {
      if (!confirm("Cập nhật từ GitHub?\n\nTrang quản lý và các khung game sẽ được tải lại (chế độ đang chọn sẽ tự áp dụng lại).")) return;
      working = true;
      go.disabled = later.disabled = true;
      msg.textContent = "Đang cập nhật…";
      let err = "";
      try {
        const r = await fetch("/__update/apply", { method: "POST", headers: HDR });
        const u = await r.json();
        if (u.error) err = u.error;
      } catch (e) {
        // Máy chủ tự khởi động lại khi server.js đổi nên kết nối có thể đứt giữa chừng: đợi nó chạy lại rồi kiểm tra
      }
      for (let n = 0; n < 20; n++) {
        await new Promise((ok) => setTimeout(ok, 1000));
        try {
          const u = await (await fetch("/__update", { cache: "no-store" })).json();
          if (u.error) err = u.error;
          if (!u.behind) { location.reload(); return; }
          if (!u.busy) break;
        } catch (e) {}
      }
      working = false;
      go.disabled = later.disabled = false;
      msg.textContent = "Cập nhật chưa thành công" + (err ? ": " + err : ".");
    };
    // Nút "Cập nhật" ở đầu trang: bắt máy chủ kiểm tra GitHub ngay; có bản mới thì hỏi và cập nhật luôn, không thì báo lý do / "đang dùng bản mới nhất"
    const now = document.getElementById("updNow");
    now.onclick = async () => {
      if (working) return;
      const label = now.textContent;
      now.disabled = true;
      now.textContent = "Đang kiểm tra…";
      const say = (t) => logToast("Cập nhật", t);
      try {
        const r = await fetch("/__update/check", { method: "POST", headers: HDR });
        const u = await r.json();
        if (!u.supported) say("Không dùng được: máy chủ không thấy git hoặc thư mục này không phải bản clone từ GitHub.");
        else if (u.error) say("Không kiểm tra được: " + u.error);
        else if (!u.behind) say("Đang dùng bản mới nhất" + (u.head ? " (" + u.head + ")" : "") + ".");
        else {
          dismissed = "";
          render(u);
          now.disabled = false;
          now.textContent = label;
          go.onclick(); // hỏi xác nhận rồi cập nhật
          return;
        }
      } catch (e) {
        say("Không kết nối được máy chủ cục bộ.");
      }
      now.disabled = false;
      now.textContent = label;
    };
    setTimeout(poll, 8000); // máy chủ kiểm tra lần đầu sau ~5 giây
    setInterval(poll, 5 * 60 * 1000);
  })();

  // --- Nhật ký hoạt động ---
  // Số liệu theo nhân vật (khóa = tên nhân vật), lưu trong localStorage của trình duyệt này, giữ 14 ngày gần nhất:
  //  - cấp tăng trong ngày: cộng các lần cấp tăng (đọc từ thanh trên của game)
  //  - lượng / Kim Nguyên Bảo kiếm được: cộng các lần SỐ TĂNG; chi: cộng các lần giảm (mua, đổi...). Số đọc từ bản lưu của game
  //    (chính xác); không có bản lưu thì không ghi.
  //  - tầng tháp leo được trong ngày: cộng phần tầng tăng so với tầng thấy lần trước, ra khỏi tháp vào lại thì đếm tiếp (đọc từ tên bãi trên thanh trên của game)
  //  - sự kiện đáng chú ý: dòng nhật ký game khớp LOG_NOTABLE trong agent.js (đồ phổ, Thần Mã)
  // Ngày tính theo giờ Việt Nam (GMT+7) như game.
  // v2: bản v1 có số liệu sai (mốc cấp 1 / 0 lượng lúc khung chưa nạp nhân vật, về sau bị tính thành "kiếm được" cả số đang có) nên bỏ hẳn
  const LOGKEY = "quanly4acc.log.v2";
  try { localStorage.removeItem("quanly4acc.log.v1"); } catch (e) {}
  const LOG_DAYS = 14;
  const LOG_EVENTS_MAX = 300;
  const LOG_GAP_MS = 6 * 3600e3;
  let logData = {};
  try { logData = JSON.parse(localStorage.getItem(LOGKEY) || "{}") || {}; } catch (e) { logData = {}; }
  let logDirty = false;
  let logUnread = 0;
  setInterval(() => {
    if (!logDirty) return;
    logDirty = false;
    try { localStorage.setItem(LOGKEY, JSON.stringify(logData)); } catch (e) {}
  }, 5000);
  window.addEventListener("pagehide", () => { try { localStorage.setItem(LOGKEY, JSON.stringify(logData)); } catch (e) {} });

  const vnDay = (t) => new Date((t || Date.now()) + 7 * 3600e3).toISOString().slice(0, 10);
  const vnTime = (t) => new Date(t + 7 * 3600e3).toISOString().slice(11, 16);
  const logKey = (i) => (live[i] && live[i].hero) || state.slots[i].hero || ("Khung " + (i + 1));
  const logChar = (key) => logData[key] || (logData[key] = { days: {}, events: [] });
  const logDay = (c, day) => c.days[day] || (c.days[day] = { lv0: 0, up: 0, earned: 0, spent: 0, knbIn: 0, knbOut: 0, tw: 0, twMax: 0 });
  const logTrim = (c) => {
    const keep = Object.keys(c.days).sort().slice(-LOG_DAYS);
    Object.keys(c.days).forEach((d) => { if (!keep.includes(d)) delete c.days[d]; });
    if (c.events.length > LOG_EVENTS_MAX) c.events.length = LOG_EVENTS_MAX;
  };

  function logSample(i, l) {
    if (!l.ready || !l.hero) return; // chưa đọc được tên nhân vật thì chưa biết ghi cho ai: bỏ qua, không ghi vào "Khung N"
    // Chỉ ghi khi có số liệu từ bản lưu của game. Chữ trên thanh trên còn số mặc định (cấp 1, 0 lượng) khi khung chưa được vẽ,
    // dùng làm mốc sẽ khiến lần đọc thật sau đó bị tính thành "tăng" cả số đang có.
    if (typeof l.goldN !== "number" || typeof l.knbN !== "number") return;
    const lvl = l.lvl | 0, gold = l.goldN, knb = l.knbN;
    const tw = l.tower | 0;
    if (!(lvl > 0) || gold == null || knb == null) return;
    const c = logChar(l.hero);
    const d = logDay(c, vnDay());
    const last = c.last;
    if (!d.lv0) d.lv0 = lvl;
    if (last && Date.now() - last.t < LOG_GAP_MS) { // đóng trang quá lâu thì chỉ đặt lại mốc, không tính chênh lệch
      if (lvl > last.lvl) d.up += lvl - last.lvl;
      const dg = gold - last.gold;
      if (dg > 0) d.earned += dg; else if (dg < 0) d.spent -= dg;
      const dk = knb - last.knb;
      if (dk > 0) d.knbIn += dk; else if (dk < 0) d.knbOut -= dk;
      // Tầng tháp: cộng phần tầng tăng so với tầng thấy lần trước (c.twPos). Ra khỏi tháp thì giữ nguyên mốc, vào lại
      // (game vào lại đúng tầng đã rời) thì đếm tiếp từ đó. Sang ngày mới số đếm về 0 nhưng mốc vẫn giữ.
      if (tw > 0 && (c.twPos | 0) > 0 && tw > c.twPos) d.tw = (d.tw | 0) + tw - c.twPos;
    }
    if (tw > 0) {
      d.twMax = Math.max(d.twMax | 0, tw);
      c.twPos = tw;
    }
    c.last = { lvl, gold, knb, t: Date.now() };
    c.lv = lvl;
    logTrim(c);
    logDirty = true;
  }

  function logEvents(i, lines) {
    if (!Array.isArray(lines)) return;
    const key = logKey(i);
    const c = logChar(key);
    const now = Date.now();
    lines.slice(0, 20).forEach((t) => {
      t = String(t).slice(0, 200);
      const top = c.events[0];
      if (top && top.text === t && now - top.t < 3000) return; // cùng một dòng đọc hai lần
      c.events.unshift({ t: now, text: t });
      logUnread++;
      logToast(key, t);
    });
    logTrim(c);
    logDirty = true;
    badge();
    if (!document.getElementById("logPanel").hidden) renderLog();
  }

  function logToast(key, text) {
    const box = document.getElementById("logToast");
    const d = document.createElement("div");
    const b = document.createElement("b");
    b.textContent = key + ": ";
    d.appendChild(b);
    d.appendChild(document.createTextNode(text));
    box.appendChild(d);
    while (box.children.length > 4) box.removeChild(box.firstChild);
    setTimeout(() => d.remove(), 10000);
  }
  const badge = () => { document.getElementById("logBadge").textContent = logUnread ? "(" + logUnread + ")" : ""; };

  const fmtNum = (n) => Math.round(n).toLocaleString("vi-VN");
  const fmtGold = (n) => (Math.abs(n) >= 1e4 ? fmtNum(n / 1e4) + " vạn" : fmtNum(n));
  let logSel = ""; // nhân vật đang xem ("" = tất cả)

  function renderLog() {
    const panel = document.getElementById("logPanel");
    const box = document.getElementById("logBox");
    const keepPanel = panel.scrollTop;
    const oldUl = box.querySelector("ul");
    const keepUl = oldUl ? oldUl.scrollTop : 0;
    box.textContent = "";
    requestAnimationFrame(() => { panel.scrollTop = keepPanel; const u = box.querySelector("ul"); if (u) u.scrollTop = keepUl; });
    const el = (tag, cls, text, parent) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      if (parent) parent.appendChild(e);
      return e;
    };
    const head = el("h2", "", "📒 Nhật ký hoạt động", box);
    el("span", "grow", "", head);
    const x = el("button", "sm", "✕ Đóng", head);
    x.onclick = () => { document.getElementById("logPanel").hidden = true; };

    const names = Object.keys(logData).sort();
    if (!names.length) {
      el("p", "dim", "Chưa có số liệu. Mở các khung game và đăng nhập, số liệu sẽ được ghi từ lúc đó.", box);
      return;
    }
    if (logSel && !names.includes(logSel)) logSel = "";
    const tabs = el("div", "tabs", "", box);
    ["", ...names].forEach((n) => {
      const b = el("button", "sm" + (n === logSel ? " on" : ""), n || "Tất cả", tabs);
      b.onclick = () => { logSel = n; renderLog(); };
    });
    const today = vnDay();
    const chars = logSel ? [logSel] : names;

    el("h3", "", "Hôm nay (" + today + ")", box);
    const t1 = el("table", "", "", box);
    const r0 = el("tr", "", "", t1);
    ["Nhân vật", "Cấp", "Cấp tăng", "Lượng kiếm", "Lượng chi", "KNB kiếm", "KNB chi", "Tầng tháp", "Tầng cao nhất"].forEach((h) => el("th", "", h, r0));
    const tot = { up: 0, earned: 0, spent: 0, knbIn: 0, knbOut: 0, tw: 0 };
    chars.forEach((n) => {
      const c = logData[n], d = c.days[today];
      if (d) Object.keys(tot).forEach((k) => { tot[k] += d[k] | 0; });
      const r = el("tr", "", "", t1);
      el("td", "", n, r);
      el("td", "", c.lv || "-", r);
      if (!d) { for (let k = 0; k < 7; k++) el("td", "dim", "-", r); return; }
      el("td", d.up ? "pos" : "dim", d.up ? "+" + d.up : "0", r);
      el("td", d.earned ? "pos" : "dim", fmtGold(d.earned), r);
      el("td", d.spent ? "neg" : "dim", fmtGold(d.spent), r);
      el("td", d.knbIn ? "pos" : "dim", fmtNum(d.knbIn), r);
      el("td", d.knbOut ? "neg" : "dim", fmtNum(d.knbOut), r);
      el("td", d.tw ? "pos" : "dim", d.tw ? "+" + d.tw : "0", r);
      el("td", d.twMax ? "" : "dim", d.twMax ? String(d.twMax) : "-", r);
    });
    if (chars.length > 1) { // hàng tổng: số tiền (ngân lượng) và các số khác của tất cả nhân vật trong ngày
      const r = el("tr", "tot", "", t1);
      el("td", "", "Tổng (" + chars.length + " nhân vật)", r);
      el("td", "dim", "-", r);
      el("td", tot.up ? "pos" : "dim", tot.up ? "+" + tot.up : "0", r);
      el("td", tot.earned ? "pos" : "dim", fmtGold(tot.earned), r);
      el("td", tot.spent ? "neg" : "dim", fmtGold(tot.spent), r);
      el("td", tot.knbIn ? "pos" : "dim", fmtNum(tot.knbIn), r);
      el("td", tot.knbOut ? "neg" : "dim", fmtNum(tot.knbOut), r);
      el("td", tot.tw ? "pos" : "dim", tot.tw ? "+" + tot.tw : "0", r);
      el("td", "dim", "-", r);
    }

    if (logSel) {
      const c = logData[logSel];
      el("h3", "", "Các ngày gần đây", box);
      const t2 = el("table", "", "", box);
      const h2 = el("tr", "", "", t2);
      ["Ngày", "Cấp tăng", "Lượng kiếm", "Lượng chi", "KNB kiếm", "Tầng tháp"].forEach((h) => el("th", "", h, h2));
      Object.keys(c.days).sort().reverse().forEach((day) => {
        const d = c.days[day], r = el("tr", "", "", t2);
        el("td", "", day, r);
        el("td", d.up ? "pos" : "dim", d.up ? "+" + d.up : "0", r);
        el("td", "", fmtGold(d.earned), r);
        el("td", "", fmtGold(d.spent), r);
        el("td", "", fmtNum(d.knbIn), r);
        el("td", d.tw ? "pos" : "dim", d.tw ? "+" + d.tw : "0", r);
      });
    }

    el("h3", "", "Sự kiện đáng chú ý" + (logSel ? "" : " (tất cả nhân vật)"), box);
    const evs = [];
    chars.forEach((n) => logData[n].events.forEach((e) => evs.push({ n, t: e.t, text: e.text })));
    evs.sort((a, b) => b.t - a.t);
    const ul = el("ul", "", "", box);
    if (!evs.length) el("li", "dim", "Chưa có. Ghi các dòng nhật ký có Đồ phổ, Thần Mã (cần khung thông báo của game ở tab Hệ thống, script tự chuyển sang tab này một lần khi tải khung).", ul);
    evs.slice(0, 100).forEach((e) => {
      const li = el("li", "", "", ul);
      el("time", "", e.t >= Date.parse(today + "T00:00:00+07:00") ? vnTime(e.t) : vnDay(e.t).slice(5) + " " + vnTime(e.t), li);
      if (!logSel) el("b", "", e.n + ": ", li);
      li.appendChild(document.createTextNode(e.text));
    });

    const clr = el("button", "sm", logSel ? "Xóa nhật ký của " + logSel : "Xóa toàn bộ nhật ký", box);
    clr.style.marginTop = "10px";
    clr.onclick = () => {
      if (!confirm(logSel ? "Xóa nhật ký của " + logSel + "?" : "Xóa nhật ký của tất cả nhân vật?")) return;
      if (logSel) delete logData[logSel]; else logData = {};
      logSel = "";
      logDirty = true;
      renderLog();
    };
  }
  document.getElementById("logBtn").onclick = () => {
    logUnread = 0;
    badge();
    const p = document.getElementById("logPanel");
    p.hidden = !p.hidden;
    if (!p.hidden) renderLog();
  };
  document.getElementById("logPanel").onclick = (e) => { if (e.target.id === "logPanel") e.target.hidden = true; };
  setInterval(() => { if (!document.getElementById("logPanel").hidden) renderLog(); }, 5000);

  document.getElementById("reloadAll").onclick = () => state.slots.forEach((s, i) => s.on && mount(i, true));
  afterCountChange();
})();
</script>
</body>
</html>
